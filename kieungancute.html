<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Thi Trắc Nghiệm Olympic Trí Tuệ Nhân Tạo 2026(kn cư tê)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for rendering math formulas -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation / Header -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-brain text-yellow-400 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">OLYMPIC TRÍ TUỆ NHÂN TẠO 2025 (ĐỀ NÂNG CAO)</h1>
                    <p class="text-xs text-indigo-200">Mã đề: 006-HARD | Tổng số câu: 100</p>
                </div>
            </div>

            <!-- Timer & Actions -->
            <div class="flex items-center space-x-6">
                <div class="flex items-center bg-indigo-950 px-3 py-1.5 rounded-lg border border-indigo-700">
                    <i class="fa-regular fa-clock text-yellow-400 mr-2"></i>
                    <span id="timer" class="font-mono font-bold text-lg text-yellow-300">180:00</span>
                </div>
                <button id="submit-btn-top" onclick="confirmSubmit()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg transition shadow-md flex items-center">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp Bài
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-6 flex-grow flex flex-col lg:flex-row gap-6 w-full">

        <!-- Left Column: Questions List -->
        <main class="lg:w-3/4 flex-grow space-y-6">

            <!-- Progress Bar -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between text-sm font-semibold mb-2">
                    <span id="progress-text">Tiến độ làm bài: 0/100 câu</span>
                    <span id="progress-percent" class="text-indigo-600">0%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Score Summary Banner (Hidden by default, shows after submission) -->
            <div id="result-banner" class="hidden bg-white p-6 rounded-xl shadow-md border-2 border-indigo-500 text-center space-y-4">
                <h2 class="text-2xl font-bold text-indigo-900">KẾT QUẢ BÀI THI</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-2xl mx-auto">
                    <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                        <div class="text-xs text-indigo-600 font-semibold uppercase">Điểm số</div>
                        <div id="score-val" class="text-2xl font-extrabold text-indigo-800">0 / 10</div>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                        <div class="text-xs text-emerald-600 font-semibold uppercase">Số câu đúng</div>
                        <div id="correct-val" class="text-2xl font-extrabold text-emerald-700">0 / 100</div>
                    </div>
                    <div class="bg-rose-50 p-3 rounded-lg border border-rose-100">
                        <div class="text-xs text-rose-600 font-semibold uppercase">Số câu sai</div>
                        <div id="wrong-val" class="text-2xl font-extrabold text-rose-700">0 / 100</div>
                    </div>
                    <div class="bg-amber-50 p-3 rounded-lg border border-amber-100">
                        <div class="text-xs text-amber-600 font-semibold uppercase">Bỏ trống</div>
                        <div id="unanswered-val" class="text-2xl font-extrabold text-amber-700">0 / 100</div>
                    </div>
                </div>
                <div id="rating-text" class="text-lg font-semibold text-slate-700"></div>

                <!-- Review Filter Buttons -->
                <div class="flex flex-wrap justify-center gap-2 pt-2 border-t border-slate-200">
                    <button onclick="filterQuestions('all')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-indigo-600 text-white">Tất cả</button>
                    <button onclick="filterQuestions('correct')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-100 text-emerald-800 hover:bg-emerald-200">Chỉ câu đúng</button>
                    <button onclick="filterQuestions('wrong')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-rose-100 text-rose-800 hover:bg-rose-200">Chỉ câu sai</button>
                    <button onclick="filterQuestions('unanswered')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-amber-100 text-amber-800 hover:bg-amber-200">Chưa làm</button>
                </div>
            </div>

            <!-- Questions Rendering Container -->
            <div id="questions-container" class="space-y-6">
                <!-- Dynamically generated via JS -->
            </div>

            <!-- Bottom Submit Button -->
            <div class="text-center py-4">
                <button id="submit-btn-bottom" onclick="confirmSubmit()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg px-8 py-3 rounded-xl transition shadow-lg inline-flex items-center">
                    <i class="fa-solid fa-paper-plane mr-3"></i> Nộp Bài Ngay
                </button>
            </div>
        </main>

        <!-- Right Column: Navigation Palette / Overview -->
        <aside class="lg:w-1/4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 sticky top-20 space-y-4">
                <h3 class="font-bold text-slate-700 text-sm flex items-center justify-between border-b pb-2">
                    <span><i class="fa-solid fa-th-large mr-2 text-indigo-600"></i> BẢNG CÂU HỎI</span>
                    <span id="palette-count" class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-500">100 Câu</span>
                </h3>

                <!-- Status Legend -->
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 pt-1">
                    <div class="flex items-center"><span class="w-3 h-3 bg-slate-200 rounded-sm mr-1.5 border"></span> Chưa làm</div>
                    <div class="flex items-center"><span class="w-3 h-3 bg-indigo-600 rounded-sm mr-1.5"></span> Đã chọn</div>
                    <div class="flex items-center"><span class="w-3 h-3 bg-emerald-500 rounded-sm mr-1.5"></span> Đúng</div>
                    <div class="flex items-center"><span class="w-3 h-3 bg-rose-500 rounded-sm mr-1.5"></span> Sai</div>
                </div>

                <!-- Palette Grid (1-100) -->
                <div id="question-palette" class="grid grid-cols-5 sm:grid-cols-10 lg:grid-cols-5 gap-1.5 max-h-[60vh] overflow-y-auto custom-scrollbar p-1">
                    <!-- Dynamically generated via JS -->
                </div>
            </div>
        </aside>
    </div>

    <!-- Script Logic & Data -->
    <script>
        // Data of 100 questions (Includes HARD Olympic Level Math/Architecture/Engineering Problems)
        const questionsData = [
            { id: 1, q: "Trong mạng nơ-ron, vị trí chuẩn hóa lô (Batch Normalization) thường được đặt ở đâu?", options: ["Trước hàm kích hoạt (ReLU) và sau lớp tuyến tính (Linear)", "Sau hàm kích hoạt (ReLU)", "Sau lớp bỏ ngẫu nhiên (dropout)", "Trước lớp đầu vào (input layer)"], answer: 0 },
            { id: 2, q: "Thành phần nào sau đây là một tham số có thể học trong một lớp tích chập?", options: ["Kích thước của dữ liệu đầu vào", "Các giá trị trong bộ lọc", "Kích thước bước nhảy", "Kích thước padding"], answer: 1 },
            { id: 3, q: "Nếu mất mát (loss) không giảm sau 5 vòng lặp (epoch) đầu tiên dù tỷ lệ học là 0.001, bạn nên làm gì đầu tiên?", options: ["Dừng lại và chọn mô hình khác", "Kiểm tra lại quy trình dữ liệu (data pipeline), tăng cường dữ liệu (augmentation) và bộ tối ưu", "Tăng tỷ lệ học lên 0.1", "Tăng số lớp của mô hình"], answer: 1 },
            { id: 4, q: "Hạn chế lớn nhất khi tinh chỉnh (fine-tune) toàn bộ mô hình GPT là gì?", options: ["Không dùng được tiếng Việt", "Cần tài nguyên tính toán rất lớn", "Không dùng được API", "Không sinh được ảnh"], answer: 1 },
            { id: 5, q: "Khi muốn trích xuất đặc trưng (features) từ ResNet50, bạn nên làm gì?", options: ["Sử dụng bộ tối ưu Adam", "Sử dụng đầu ra từ lớp gần cuối (ví dụ: avgpool, penultimate, ...)", "Thêm nhiều lớp bỏ ngẫu nhiên (dropout)", "Thêm lớp kết nối đầy đủ siêu tốc (fully connected) mới"], answer: 1 },
            { id: 6, q: "Để xóa gradient cũ trước khi thực hiện bước lan truyền ngược tiếp theo trong PyTorch, bạn dùng lệnh nào?", options: ["optimizer.clear()", "optimizer.zero_grad()", "torch.no_grad()", "model.reset_gradients()"], answer: 1 },
            { id: 7, q: "Điều nào sau đây là ĐÚNG khi so sánh SVM với k-NN?", options: ["Cả hai phương pháp chỉ được sử dụng cho các bài toán phân loại (không phải hồi quy)", "Huấn luyện SVM có thể tốn kém về mặt tính toán, đặc biệt đối với các bộ dữ liệu lớn, trong khi huấn luyện k-NN không liên quan đến quy trình huấn luyện rõ ràng", "SVM luôn tốt hơn k-NN trên mọi tập dữ liệu", "Dự đoán của cả hai phương pháp đều chậm vì cả hai đều cần xử lý tất cả các mẫu dữ liệu huấn luyện để dự đoán mẫu dữ liệu mới"], answer: 1 },
            { id: 8, q: "Đối với SVM phi tuyến, để dự đoán, đáp án nào đúng?", options: ["Cần sử dụng cùng hàm chuyển đổi tương tự với giai đoạn huấn luyện", "Sử dụng một hàm chuyển đổi khác với giai đoạn huấn luyện", "SVM phi tuyến luôn tốt hơn SVM tuyến tính trong mọi tập dữ liệu", "Không cần hàm chuyển đổi"], answer: 0 },
            { id: 9, q: "Khi sử dụng torchvision.models.resnet18(pretrained=True) trong PyTorch, mục đích chính là gì?", options: ["Huấn luyện mô hình từ đầu", "Tăng kích thước lô (batch size)", "Thử nghiệm mô hình mới", "Sử dụng trọng số huấn luyện trước (pre-trained weights) trên ImageNet để trích xuất đặc trưng"], answer: 3 },
            // HARD QUESTION 1
            { id: 10, q: "[KHÓ] Tính dung lượng VRAM tối thiểu để lưu trọng số (weights), gradient và bộ tối ưu Adam (FP32) cho mô hình LLM 7 tỷ tham số (7B) khi huấn luyện ở chế độ Mixed Precision (weights/grads dạng FP16)?", options: ["14 GB", "28 GB", "56 GB", "112 GB"], answer: 3 },
            { id: 11, q: "Trong Pandas, phương thức nào dùng để lấy 5 dòng đầu tiên của DataFrame?", options: ["df.head()", "df.take(5)", "df.top()", "df.first(5)"], answer: 0 },
            { id: 12, q: "Thuật toán học máy nào sau đây là phổ biến và hiệu quả, dựa trên ý tưởng bagging?", options: ["XGBoost", "Hồi quy tuyến tính (Linear Regression)", "Cây quyết định (Decision Tree)", "Rừng ngẫu nhiên (Random Forest)"], answer: 3 },
            { id: 13, q: "Kỹ thuật nào sau đây được sử dụng để giảm ảnh hưởng của nhiễu và ngoại lệ trong tập dữ liệu?", options: ["Phân tích thành phần chính (Principal Component Analysis - PCA)", "Chính quy hóa (Regularization)", "Xác thực chéo (Cross-validation)", "Trích xuất đặc trưng (Feature extraction)"], answer: 0 },
            { id: 14, q: "Trong xử lý ngôn ngữ tự nhiên, đâu là thứ tự đúng của các bước xử lý cơ bản sau đây? (1. Tách từ, 2. Chuẩn hóa văn bản, 3. Rút gọn từ, 4. Gán nhãn từ loại)", options: ["2 -> 1 -> 4 -> 3", "2 -> 1 -> 3 -> 4", "1 -> 3 -> 2 -> 4", "1 -> 2 -> 4 -> 3"], answer: 0 },
            // HARD QUESTION 2
            { id: 15, q: "[KHÓ] Trong cơ chế Multi-Head Self-Attention với $N$ tokens và độ dài biểu diễn $d_{\\text{model}}$, độ phức tạp tính toán phép nhân ma trận Query-Key $Q \\cdot K^T$ là bao nhiêu?", options: ["$O(N \\cdot d_{\\text{model}}^2)$", "$O(N^2 \\cdot d_{\\text{model}})$", "$O(N^3)$", "$O(N \\cdot \\log N)$"], answer: 1 },
            { id: 16, q: "Kỹ thuật Chain-of-Thought là gì?", options: ["Yêu cầu mô hình trả lời càng ngắn gọn càng tốt để tiết kiệm tài nguyên", "Huấn luyện mô hình dự đoán từ tiếp theo bằng dữ liệu song ngữ", "Yêu cầu mô hình sinh câu hỏi thay vì câu trả lời", "Thúc đẩy mô hình giải bài toán bằng cách liệt kê từng bước suy luận trung gian"], answer: 3 },
            { id: 17, q: "Trọng số các thuộc tính trong k-NN được thực hiện bằng:", options: ["Cập nhật giá trị thuộc tính của mẫu dữ liệu theo các trọng số khác nhau", "Thuộc tính quan trọng hơn được thêm vào bởi trọng số lớn hơn", "Điều chỉnh phép tính khoảng cách bằng cách nhân từng thuộc tính với trọng số", "Một ma trận trọng số được sử dụng để tính toán các hàng xóm"], answer: 2 },
            { id: 18, q: "Cho 3 cụm K-means C1, C2, C3. Tâm của 3 cụm mới sẽ được cập nhật bằng cách nào?", options: ["Lấy giá trị lớn nhất của các điểm", "Tính trung bình cộng tọa độ của tất cả các điểm dữ liệu thuộc cụm đó", "Lấy giá trị trung vị (median)", "Chọn ngẫu nhiên 1 điểm trong cụm"], answer: 1 },
            { id: 19, q: "Phát biểu nào sau đây mô tả đúng cách mã nhúng từ GloVe được tạo ra?", options: ["Được tạo ra trong quá trình dịch máy", "Sử dụng cơ chế chú ý (attention) để tạo vector", "Được huấn luyện từ ma trận đồng xuất hiện (co-occurrence matrix) toàn cục", "Một dạng vector gồm các số 0 và một số 1 (one-hot vector)"], answer: 2 },
            { id: 20, q: "Mô hình BERT nhận đầu vào là gì?", options: ["Vector ID, mặt nạ chú ý (attention mask), ID loại token", "Chỉ văn bản thô (raw text)", "Cặp câu với nhúng (embedding)", "Từ rời rạc"], answer: 0 },
            { id: 21, q: "Nếu muốn sử dụng GPT để sinh câu trả lời dựa trên một đoạn văn, mô hình nào phù hợp nhất?", options: ["BERT", "GPT-2", "GPT-Neo", "GPT-3.5 hoặc GPT-4 với gợi ý phù hợp"], answer: 3 },
            { id: 22, q: "Nếu thêm bỏ ngẫu nhiên (dropout) vào mô hình nhưng độ chính xác kiểm tra giảm mạnh, bạn nên thử gì đầu tiên?", options: ["Dùng bộ tối ưu khác", "Giảm xác suất bỏ ngẫu nhiên xuống nhỏ hơn", "Tắt bỏ ngẫu nhiên", "Tăng xác suất bỏ ngẫu nhiên lên 0.8"], answer: 1 },
            { id: 23, q: "Trong bài toán phân loại văn bản, nếu mô hình học tốt từ khóa nhưng không hiểu ngữ cảnh, phương pháp nào giúp cải thiện?", options: ["Giảm số chiều nhúng (embedding)", "Dùng mô hình dựa trên chú ý (attention-based) như BERT", "Chuyển sang dùng TF-IDF", "Bỏ nhúng, dùng vector one-hot"], answer: 1 },
            { id: 24, q: "Giả sử dùng phương pháp 1-NN để dự đoán nhãn cho $x$ dựa trên tập $D$, công thức tính là:", options: ["$y^* = \\arg\\max_{y} d(x, y)$", "$y^* = \\arg\\min_{(x_i, y_i) \\in D} d(x, x_i)$", "$a^*$ trong đó $(a^*, y^*) = \\arg\\min d(x, a)$", "$y^* = \\min d(x, a)$"], answer: 1 },
            // HARD QUESTION 3
            { id: 25, q: "[KHÓ] Cho mạng CNN có 3 lớp tích chập liên tiếp, đều dùng bộ lọc $3 \\times 3$, bước nhảy (stride) = 1, không dùng padding. Trường thụ cảm (Receptive Field) của một điểm ở đầu ra lớp thứ 3 so với ảnh đầu vào là bao nhiêu?", options: ["$3 \\times 3$", "$5 \\times 5$", "$7 \\times 7$", "$9 \\times 9$"], answer: 2 },
            { id: 26, q: "Bản đồ đặc trưng thu được từ bộ lọc Conv2D có đường kẻ sọc thể hiện bộ lọc đang phát hiện đặc trưng gì?", options: ["Các mẫu bề mặt (texture patterns)", "Các đốm màu (color blobs)", "Các cạnh theo hướng kết hợp ngang và dọc (cross directional edges)", "Cạnh theo hướng ngang"], answer: 2 },
            { id: 27, q: "Cho đầu vào $(1, 32, 32, 3)$, qua lớp Conv2D(filters=32, kernel_size=(5,5), strides=(2,2), padding='same'), kích thước output_tensor là:", options: ["(1, 16, 16, 32)", "(1, 16, 16, 3)", "(1, 14, 14, 32)", "(1, 32, 32, 32)"], answer: 0 },
            { id: 28, q: "Mục đích chính của lấy mẫu phủ định (Negative Sampling) trong huấn luyện vector từ là gì?", options: ["Tăng số lượng tham số của mô hình", "Giúp mô hình sinh ra văn bản dài hơn", "Giúp cải thiện độ chính xác", "Giảm chi phí tính toán khi huấn luyện trên tập từ vựng lớn"], answer: 3 },
            { id: 29, q: "Khi sử dụng bộ tối ưu Adam, nếu mất mát ngừng giảm sớm (plateau), bạn nên thử gì tiếp theo?", options: ["Đặt lại toàn bộ mô hình", "Tăng kích thước lô (batch size)", "Bỏ chuẩn hóa lô (BatchNorm)", "Giảm tỷ lệ học (learning rate) hoặc thử lại với SGD"], answer: 3 },
            { id: 30, q: "Học tự giám sát (self-supervised learning) thường sử dụng phương pháp nào?", options: ["Đầu phân loại (classification head)", "Phân cụm (clustering)", "Tăng cường dữ liệu (augmentation) và mất mát đối lập (contrastive loss)", "Gắn nhãn thủ công"], answer: 2 },

            { id: 91, q: "Nếu xác suất $P(\\text{Spam}) = 0.3$ thì $P(\\text{Not Spam})$ bằng:", options: ["0.3", "0.7", "0.5", "1.0"], answer: 1 },
            { id: 92, q: "Độ đo Gini Impurity của nút thuần khiết (chỉ chứa 1 lớp) bằng:", options: ["0", "0.5", "1", "Vô cùng"], answer: 0 },
            { id: 93, q: "Thuật toán PCA thực hiện chéo hóa ma trận nào?", options: ["Ma trận đơn vị", "Ma trận hiệp phương sai (Covariance Matrix)", "Ma trận nhầm lẫn", "Ma trận nghịch đảo"], answer: 1 },
            // HARD QUESTION 12
            { id: 94, q: "[KHÓ] Trong kỹ thuật DDP (Distributed Data Parallel) của PyTorch, quá trình đồng bộ hóa gradient giữa các GPU ở cuối mỗi bước lan truyền ngược được thực hiện thông qua thao tác giao tiếp phân tán nào?", options: ["All-Gather", "All-Reduce", "Broadcast", "Reduce-Scatter"], answer: 1 },
            { id: 95, q: "Positional Encoding trong Transformer dùng để:", options: ["Cung cấp thông tin vị trí của các từ trong chuỗi", "Giảm từ vựng", "Tính loss", "Thay thế Softmax"], answer: 0 },
            { id: 96, q: "Để tắt tính toán gradient trong PyTorch khi suy luận, ta dùng:", options: ["with torch.no_grad():", "with torch.eval():", "with torch.freeze():", "with torch.disable_grad():"], answer: 0 },
            { id: 97, q: "Thuật toán t-SNE dùng chủ yếu để:", options: ["Phân loại ảnh", "Trực quan hóa dữ liệu nhiều chiều xuống 2D/3D", "Huấn luyện LLM", "Dịch tự động"], answer: 1 },
            { id: 98, q: "Kiến trúc Autoencoder gồm 2 phần:", options: ["Encoder và Decoder", "Generator và Discriminator", "Backbone và Head", "Actor và Critic"], answer: 0 },
            { id: 99, q: "GAN gồm 2 mạng đối đầu nhau là:", options: ["Encoder và Decoder", "Generator và Discriminator", "CNN và RNN", "Policy và Value"], answer: 1 },
            { id: 100, q: "Tham số $d_{\\text{model}}$ trong Transformer đại diện cho:", options: ["Số chiều biểu diễn (embedding dimension) của các token", "Số lượng head trong Attention", "Số lớp Encoder", "Kích thước từ vựng"], answer: 0 }
        ];

        // Global State Variables
        let userAnswers = {};
        let isSubmitted = false;
        let timeRemaining = 180 * 60; // 180 minutes in seconds
        let timerInterval = null;
        let currentFilter = 'all';

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
            renderPalette();
            startTimer();
        });

        // Start Countdown Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
                    submitQuiz();
                    return;
                }
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                document.getElementById('timer').innerText = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        // Render Questions List
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const optionPrefixes = ['A', 'B', 'C', 'D'];

            questionsData.forEach((qObj, index) => {
                const qCard = document.createElement('div');
                qCard.id = `question-card-${qObj.id}`;
                qCard.className = `question-card bg-white p-6 rounded-xl shadow-sm border border-slate-200 transition duration-200`;
                qCard.dataset.questionId = qObj.id;

                let optionsHTML = '';
                qObj.options.forEach((optText, optIdx) => {
                    const isChecked = userAnswers[qObj.id] === optIdx;
                    let optionStyle = 'border-slate-200 hover:bg-slate-50';
                    let badgeHTML = '';

                    // Styling for Post-Submission Review
                    if (isSubmitted) {
                        const isUserPick = userAnswers[qObj.id] === optIdx;
                        const isCorrectAnswer = qObj.answer === optIdx;

                        if (isCorrectAnswer) {
                            optionStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                            badgeHTML = `<span class="ml-auto text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-normal"><i class="fa-solid fa-check mr-1"></i>Đáp án đúng</span>`;
                        } else if (isUserPick && !isCorrectAnswer) {
                            optionStyle = 'border-rose-500 bg-rose-50 text-rose-900 font-semibold';
                            badgeHTML = `<span class="ml-auto text-xs bg-rose-600 text-white px-2 py-0.5 rounded font-normal"><i class="fa-solid fa-xmark mr-1"></i>Đã chọn (Sai)</span>`;
                        }
                    }

                    optionsHTML += `
                        <label class="flex items-center p-3.5 border rounded-lg cursor-pointer transition ${optionStyle} ${isChecked && !isSubmitted ? 'border-indigo-600 bg-indigo-50 font-medium' : ''}">
                            <input type="radio" 
                                   name="q_${qObj.id}" 
                                   value="${optIdx}" 
                                   ${isChecked ? 'checked' : ''} 
                                   ${isSubmitted ? 'disabled' : ''} 
                                   onchange="selectOption(${qObj.id}, ${optIdx})"
                                   class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                            <span class="ml-3 text-sm font-bold text-slate-700 mr-2">${optionPrefixes[optIdx]}.</span>
                            <span class="text-sm text-slate-800 flex-grow">${optText}</span>
                            ${badgeHTML}
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <h3 class="font-bold text-base text-slate-800 leading-snug">
                            <span class="text-indigo-600">Câu ${qObj.id}:</span> ${qObj.q}
                        </h3>
                    </div>
                    <div class="space-y-2.5">
                        ${optionsHTML}
                    </div>
                `;

                container.appendChild(qCard);
            });

            // Trigger MathJax re-render
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // Render Right Navigation Palette
        function renderPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';

            questionsData.forEach(qObj => {
                const isAnswered = userAnswers.hasOwnProperty(qObj.id);
                let btnClass = 'bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200';

                if (isSubmitted) {
                    const userPick = userAnswers[qObj.id];
                    if (userPick === qObj.answer) {
                        btnClass = 'bg-emerald-500 text-white border-emerald-600 font-bold';
                    } else if (userPick !== undefined) {
                        btnClass = 'bg-rose-500 text-white border-rose-600 font-bold';
                    } else {
                        btnClass = 'bg-amber-400 text-slate-900 border-amber-500 font-bold';
                    }
                } else if (isAnswered) {
                    btnClass = 'bg-indigo-600 text-white border-indigo-700 font-bold';
                }

                const btn = document.createElement('button');
                btn.id = `palette-btn-${qObj.id}`;
                btn.className = `h-9 w-full rounded border text-xs flex items-center justify-center transition shadow-sm ${btnClass}`;
                btn.innerText = qObj.id;
                btn.onclick = () => scrollToQuestion(qObj.id);
                palette.appendChild(btn);
            });
        }

        // Option Selection Handler
        function selectOption(qId, optionIdx) {
            if (isSubmitted) return;
            userAnswers[qId] = optionIdx;
            updateProgress();
            renderPalette();

            // Highlight selected card visually
            const card = document.getElementById(`question-card-${qId}`);
            if (card) {
                card.querySelectorAll('label').forEach((lbl, idx) => {
                    if (idx === optionIdx) {
                        lbl.classList.add('border-indigo-600', 'bg-indigo-50', 'font-medium');
                    } else {
                        lbl.classList.remove('border-indigo-600', 'bg-indigo-50', 'font-medium');
                    }
                });
            }
        }

        // Update Progress Bar
        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const percent = Math.round((answeredCount / 100) * 100);
            document.getElementById('progress-text').innerText = `Tiến độ làm bài: ${answeredCount}/100 câu`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        // Scroll to Specific Question
        function scrollToQuestion(qId) {
            const qCard = document.getElementById(`question-card-${qId}`);
            if (qCard) {
                qCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                qCard.classList.add('ring-2', 'ring-indigo-500');
                setTimeout(() => qCard.classList.remove('ring-2', 'ring-indigo-500'), 1500);
            }
        }

        // Submit Confirmation
        function confirmSubmit() {
            if (isSubmitted) return;
            const answeredCount = Object.keys(userAnswers).length;
            const unanswered = 100 - answeredCount;

            let msg = `Bạn đã làm ${answeredCount}/100 câu.`;
            if (unanswered > 0) {
                msg += ` Còn ${unanswered} câu chưa trả lời.`;
            }
            msg += ` Bạn có chắc chắn muốn nộp bài?`;

            if (confirm(msg)) {
                submitQuiz();
            }
        }

        // Submit Quiz & Grade Results
        function submitQuiz() {
            isSubmitted = true;
            clearInterval(timerInterval);

            // Grade Answers
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;

            questionsData.forEach(qObj => {
                const userPick = userAnswers[qObj.id];
                if (userPick === undefined) {
                    unanswered++;
                } else if (userPick === qObj.answer) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            const score = (correct / 10).toFixed(1); // Scale of 10

            // Update UI Elements
            document.getElementById('score-val').innerText = `${score} / 10`;
            document.getElementById('correct-val').innerText = `${correct} / 100`;
            document.getElementById('wrong-val').innerText = `${wrong} / 100`;
            document.getElementById('unanswered-val').innerText = `${unanswered} / 100`;

            // Evaluation Rating
            let rating = '';
            if (score >= 9.0) rating = "🎉 Xuất sắc! Bạn có tư duy AI / Deep Learning ở trình độ Chuyên gia!";
            else if (score >= 8.0) rating = "👏 Giỏi! Kết quả vô cùng ấn tượng!";
            else if (score >= 6.5) rating = "👍 Khá! Hãy tiếp tục luyện tập thêm các dạng toán tính toán nâng cao.";
            else if (score >= 5.0) rating = "😐 Trung bình! Cần ôn tập lại các lý thuyết cốt lõi và công thức.";
            else rating = "⚠️ Chưa đạt! Cần học kỹ lại các thuật toán và kiến trúc mạng.";

            document.getElementById('rating-text').innerText = rating;
            document.getElementById('result-banner').classList.remove('hidden');

            // Hide/Disable Buttons
            document.getElementById('submit-btn-top').classList.add('hidden');
            document.getElementById('submit-btn-bottom').classList.add('hidden');

            // Re-render UI with Correct Answers Highlighted
            renderQuestions();
            renderPalette();

            // Scroll to Top Result Banner
            document.getElementById('result-banner').scrollIntoView({ behavior: 'smooth' });
        }

        // Filter Questions (All, Correct, Wrong, Unanswered)
        function filterQuestions(type) {
            currentFilter = type;
            questionsData.forEach(qObj => {
                const qCard = document.getElementById(`question-card-${qObj.id}`);
                const userPick = userAnswers[qObj.id];
                const isCorrect = userPick === qObj.answer;
                const isUnanswered = userPick === undefined;

                if (type === 'all') {
                    qCard.classList.remove('hidden');
                } else if (type === 'correct' && isCorrect) {
                    qCard.classList.remove('hidden');
                } else if (type === 'wrong' && !isCorrect && !isUnanswered) {
                    qCard.classList.remove('hidden');
                } else if (type === 'unanswered' && isUnanswered) {
                    qCard.classList.remove('hidden');
                } else {
                    qCard.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
