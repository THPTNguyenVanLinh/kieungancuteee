    <!-- Script Logic & Data -->
    <script>
        // Data of 100 BRAND NEW questions (AI, Deep Learning, Math for AI, LLM Architecture)
        const questionsData = [
            { id: 1, q: "Lớp nào trong mạng CNN có tác dụng giảm kích thước không gian (spatial dimensions) của feature map mà không cần thêm tham số có thể học?", options: ["Dense Layer", "Pooling Layer", "Convolutional Layer", "Batch Normalization Layer"], answer: 1 },
            { id: 2, q: "Hàm kích hoạt nào giải quyết triệt để vấn đề 'Dead ReLU' bằng cách cho phép một gradient nhỏ chảy qua khi đầu vào nhỏ hơn 0?", options: ["Sigmoid", "Tanh", "Leaky ReLU", "Softmax"], answer: 2 },
            { id: 3, q: "Hiện tượng Overfitting (Học quá mức) trong Machine Learning biểu hiện rõ nhất qua triệu chứng nào?", options: ["Loss trên tập Train rất thấp nhưng Loss trên tập Validation/Test lại cao", "Loss trên cả tập Train và Validation đều rất cao", "Loss trên tập Train giảm quá chậm", "Độ chính xác trên tập Validation cao hơn hẳn tập Train"], answer: 0 },
            { id: 4, q: "Trong PyTorch, phương thức nào được dùng để chuyển một Tensor từ bộ nhớ RAM (CPU) sang bộ nhớ VRAM của GPU?", options: [".to('cuda')", ".cuda_enable()", ".gpu_transform()", ".shift_device()"], answer: 0 },
            { id: 5, q: "Trong thuật toán K-Means, phương pháp phổ biến nào được sử dụng để xác định số cụm $K$ tối ưu khi không có nhãn dữ liệu?", options: ["Cross-validation", "Gradient Descent", "Phương pháp khuỷu tay (Elbow Method)", "Grid Search"], answer: 2 },
            { id: 6, q: "Độ đo nào phù hợp nhất để đánh giá mô hình phân loại dữ liệu cực kỳ mất cân bằng (chẳng hạn bài toán phát hiện giao dịch gian lận chiếm 0.01%)?", options: ["Accuracy (Độ chính xác)", "PR-AUC (Area Under Precision-Recall Curve)", "Mean Squared Error (MSE)", "R-Squared"], answer: 1 },
            { id: 7, q: "Thuật toán Random Forest giảm hiện tượng Overfitting so với một Cây quyết định (Decision Tree) đơn lẻ chủ yếu nhờ cơ chế nào?", options: ["Tăng độ sâu của cây", "Tự động chuẩn hóa dữ liệu", "Giảm số lượng mẫu", "Bagging (Bootstrap Aggregating) và chọn ngẫu nhiên tập thuộc tính"], answer: 3 },
            { id: 8, q: "Trong huấn luyện mạng nơ-ron sâu, hiện tượng Bão hòa Gradient (Gradient Saturation) xảy ra chủ yếu khi sử dụng hàm kích hoạt nào?", options: ["Sigmoid hoặc Tanh", "ReLU", "Leaky ReLU", "GELU"], answer: 0 },
            { id: 9, q: "Bộ tối ưu Adam (Adaptive Moment Estimation) kết hợp ý tưởng từ hai thuật toán tối ưu nào?", options: ["SGD và Adagrad", "RMSProp và SGD", "Momentum và RMSProp", "Nesterov và Adadelta"], answer: 2 },
            // HARD QUESTION 1
            { id: 10, q: "[KHÓ] Một ảnh RGB kích thước $224 \\times 224 \\times 3$ đi qua lớp Conv2D có 64 bộ lọc kích thước $7 \\times 7$, bước nhảy Stride = 2, Padding = 3. Kích thước (Height $\\times$ Width $\\times$ Channels) của Tensor đầu ra là bao nhiêu?", options: ["$224 \\times 224 \\times 64$", "$112 \\times 112 \\times 64$", "$112 \\times 112 \\times 3$", "$56 \\times 56 \\times 64$"], answer: 1 },
            { id: 11, q: "Kỹ thuật RAG (Retrieval-Augmented Generation) trong LLM nhằm giải quyết vấn đề lớn nào?", options: ["Giảm ảo giác (Hallucination) và bổ sung kiến thức thực tế cập nhật", "Tăng tốc độ sinh chuỗi token lên gấp 10 lần", "Giảm kích thước trọng số của mô hình LLM", "Tự động dịch thuật dữ liệu sang tiếng Việt"], answer: 0 },
            { id: 12, q: "Trong mô hình Transformer tiêu chuẩn, công thức tính Scaled Dot-Product Attention là:", options: ["$\\text{Softmax}(Q \\cdot K^T) \\cdot V$", "$\\text{Softmax}\\left(\\frac{Q \\cdot K^T}{\\sqrt{d_k}}\\right) \\cdot V$", "$\\text{Softmax}\\left(\\frac{Q \\cdot V^T}{\\sqrt{d_k}}\\right) \\cdot K$", "$\\frac{\\text{Softmax}(Q \\cdot K^T)}{d_k} \\cdot V$"], answer: 1 },
            { id: 13, q: "Độ đo KL-Divergence (Kullback-Leibler Divergence) trong Machine Learning được dùng để đo lường điều gì?", options: ["Sự khác biệt giữa hai phân phối xác suất", "Khoảng cách Euclidean giữa hai vector dữ liệu", "Độ tương đồng cosine giữa hai đoạn văn bản", "Độ phức tạp tính toán của thuật toán"], answer: 0 },
            { id: 14, q: "Cho ma trận $A$ kích thước $m \\times n$ và ma trận $B$ kích thước $n \\times p$. Tổng số phép nhân số thực cần thực hiện để tính ma trận tích $C = A \\cdot B$ là bao nhiêu?", options: ["$m + n + p$", "$m \\cdot p$", "$m \\cdot n \\cdot p$", "$n \\cdot p$"], answer: 2 },
            { id: 15, q: "Trong NLP, kỹ thuật Byte-Pair Encoding (BPE) được sử dụng nhằm mục đích chính gì?", options: ["Loại bỏ từ dừng (Stopwords)", "Tách từ / Phân đoạn Token dưới dạng Subword hiệu quả", "Tính trọng số TF-IDF cho văn bản", "Trích xuất thực thể tên riêng (NER)"], answer: 1 },
            { id: 16, q: "Thuật toán Gradient Boosting cải thiện mô hình bằng cách nào?", options: ["Huấn luyện các mô hình độc lập song song rồi lấy trung bình", "Thay đổi trọng số các mẫu dữ liệu ở mỗi vòng", "Dùng mạng nơ-ron thay cho cây quyết định", "Huấn luyện cây sau để dự đoán sai số (Residuals) của cây phía trước"], answer: 3 },
            { id: 17, q: "Hiện tượng 'Mode Collapse' là rủi ro hay gặp phải trong quá trình huấn luyện mô hình nào?", options: ["Generative Adversarial Networks (GAN)", "Variational Autoencoder (VAE)", "Random Forest", "Support Vector Machines (SVM)"], answer: 0 },
            { id: 18, q: "Trong thư viện Scikit-Learn, lớp nào dùng để chuẩn hóa dữ liệu về trung bình bằng 0 và độ lệch chuẩn bằng 1?", options: ["MinMaxScaler", "StandardScaler", "RobustScaler", "Normalizer"], answer: 1 },
            { id: 19, q: "Khối kết nối tắt (Skip Connection / Residual Connection) trong ResNet giúp giải quyết vấn đề cốt lõi nào?", options: ["Tăng số lượng tham số của mô hình", "Tăng kích thước ảnh đầu vào", "Vấn đề suy giảm hiệu năng (Degradation Problem) khi tăng độ sâu mạng", "Giảm dung lượng VRAM khi suy luận"], answer: 2 },
            // HARD QUESTION 2
            { id: 20, q: "[KHÓ] Cho mô hình Transformer có $d_{\\text{model}} = 4096$ và $32$ Attention Heads ($h = 32$). Kích thước chiều không gian ($d_k$) của từng Head Attention riêng biệt là bao nhiêu?", options: ["128", "256", "512", "64"], answer: 0 },
            { id: 21, q: "Trong Học tăng cường (Reinforcement Learning), phương trình Bellman đóng vai trò mô tả điều gì?", options: ["Mối quan hệ đệ quy giữa giá trị trạng thái hiện tại và giá trị trạng thái tương lai", "Hàm mất mát Cross-Entropy giữa các hành động", "Phân phối xác suất của phần thưởng", "Tỷ lệ hội tụ của mô hình Actor-Critic"], answer: 0 },
            { id: 22, q: "Hàm mất mát Focal Loss được đề xuất nhằm mục đích chính nào trong bài toán Phát hiện vật thể (Object Detection)?", options: ["Tăng tốc độ tính toán gradient", "Giải quyết vấn đề mất cân bằng cực đoan giữa mẫu dễ (nền) và mẫu khó (vật thể)", "Thay thế hàm L1 Loss trong hồi quy khung chứa", "Chuẩn hóa trọng số của mạng"], answer: 1 },
            { id: 23, q: "Kỹ thuật Quantization (Lượng hóa trọng số, ví dụ từ FP16 xuống INT8) nhằm mục đích chính là gì?", options: ["Giảm dung lượng bộ nhớ và tăng tốc độ suy luận (Inference)", "Tăng độ chính xác phân loại của mô hình", "Tránh hiện tượng Vanishing Gradient", "Tự động gán nhãn dữ liệu thô"], answer: 0 },
            { id: 24, q: "Phương pháp giảm chiều dữ liệu PCA (Principal Component Analysis) xác định các trục tọa độ mới dựa trên nguyên lý nào?", options: ["Tối đa hóa phương sai (Variance) của dữ liệu được chiếu", "Tối thiểu hóa khoảng cách Manhattan giữa các điểm", "Tối đa hóa sai số tái tạo", "Phân cụm các điểm dựa trên mật độ"], answer: 0 },
            { id: 25, q: "Khi áp dụng hàm Softmax vào vector Logits $[2.0, 1.0, 0.0]$, tổng giá trị các xác suất ở đầu ra luôn bằng bao nhiêu?", options: ["3.0", "0.0", "1.0", "Phụ thuộc vào hằng số temperature"], answer: 2 },
            { id: 26, q: "Điểm khác biệt cốt lõi giữa kỹ thuật QLoRA và LoRA thông thường là gì?", options: ["QLoRA nén trọng số mô hình gốc xuống dạng 4-bit (NF4) trước khi thêm các ma trận LoRA", "QLoRA không sử dụng ma trận phân rã thứ hạng thấp", "QLoRA chỉ dùng cho bài toán phân loại ảnh", "QLoRA loại bỏ hoàn toàn quá trình lan truyền ngược"], answer: 0 },
            { id: 27, q: "Trong PyTorch, khi gọi hàm `loss.backward()`, hệ thống sẽ thực hiện thao tác gì?", options: ["Cập nhật trọng số mô hình lập tức", "Tính toán Gradient của loss theo tất cả tham số có `requires_grad=True`", "Xóa toàn bộ bộ nhớ GPU", "Chuyển mô hình sang chế độ evaluation"], answer: 1 },
            { id: 28, q: "Ma trận chuyển trạng thái trong Chuỗi Markov (Markov Chain) có tính chất đặc trưng nào?", options: ["Tổng các phần tử trên mỗi cột bằng 0", "Mọi phần tử đều lớn hơn 1", "Tổng các phần tử trên mỗi hàng luôn bằng 1", "Là ma trận đối xứng"], answer: 2 },
            { id: 29, q: "Cấu trúc LSTM kiểm soát dòng thông tin truyền qua nhờ vào thành phần cốt lõi nào?", options: ["Các cổng (Forget Gate, Input Gate, Output Gate) và Ô trạng thái (Cell State)", "Các lớp tích chập 1D", "Cơ chế Self-Attention", "Cổng bão hòa tuyến tính"], answer: 0 },
            // HARD QUESTION 3
            { id: 30, q: "[KHÓ] Tính đạo hàm bậc nhất của hàm kích hoạt Swish $f(x) = x \\cdot \\sigma(x)$ theo $x$, trong đó $\\sigma(x)$ là hàm Sigmoid?", options: ["$f'(x) = \\sigma(x) + x \\cdot \\sigma(x)(1 - \\sigma(x))$", "$f'(x) = \\sigma(x)(1 - \\sigma(x))$", "$f'(x) = 1 + \\sigma(x)$", "$f'(x) = x^2 \\cdot \\sigma(x)$"], answer: 0 },
            { id: 31, q: "Trong bài toán phân loại nhị phân, nếu ta nâng ngưỡng quyết định (Threshold) của hàm Sigmoid từ 0.5 lên 0.8, xu hướng nào sau đây sẽ xảy ra?", options: ["Precision có xu hướng tăng, Recall có xu hướng giảm", "Precision giảm, Recall tăng", "Cả Precision và Recall đều tăng", "Cả Precision và Recall đều giảm về 0"], answer: 0 },

            { id: 82, q: "Kỹ thuật Speculative Decoding giúp tăng tốc độ suy luận của LLM dựa trên ý tưởng nào?", options: ["Sử dụng mô hình nhỏ (Draft Model) dự đoán trước chuỗi token rồi cho mô hình lớn xác nhận", "Chuyển toàn bộ LLM sang chạy trên CPU", "Bỏ qua các lớp Attention cuối cùng", "Nén tập dữ liệu đầu vào"], answer: 0 },
            { id: 83, q: "Ma trận nhầm lẫn (Confusion Matrix) cho bài toán phân loại 3 lớp đối tượng có kích thước là bao nhiêu?", options: ["$3 \\times 3$", "$3 \\times 1$", "$2 \\times 2$", "$9 \\times 9$"], answer: 0 },
            { id: 84, q: "Khi dùng Early Stopping trong huấn luyện, tham số `patience = 5` có ý nghĩa là gì?", options: ["Dừng huấn luyện nếu Loss trên tập Validation không cải thiện sau 5 epoch liên tiếp", "Chỉ huấn luyện tối đa 5 epoch", "Lưu trọng số mô hình 5 lần", "Bỏ qua 5 mẫu dữ liệu đầu tiên"], answer: 0 },
            { id: 85, q: "Hàm kích hoạt GELU (Gaussian Error Linear Unit) được sử dụng phổ biến trong mô hình nào?", options: ["BERT và GPT", "AlexNet", "LeNet-5", "Perceptron cổ điển"], answer: 0 },
            { id: 86, q: "Khái niệm 'Out-of-Vocabulary' (OOV) trong NLP được khắc phục hiệu quả nhất bằng kỹ thuật nào?", options: ["Sử dụng thuật toán tách từ Subword Tokenization (BPE, WordPiece)", "Xóa bỏ tất cả các từ lạ", "Thay thế từ lạ bằng số 0", "Tăng kích thước từ vựng lên vô hạn"], answer: 0 },
            { id: 87, q: "Kỹ thuật Leave-One-Out Cross-Validation (LOOCV) tương đương với K-Fold Cross-Validation khi $K$ bằng bao nhiêu?", options: ["Bằng tổng số mẫu dữ liệu $N$", "Bằng 1", "Bằng 10", "Bằng 2"], answer: 0 },
            { id: 88, q: "Trong mô hình GAN, vai trò của mạng Discriminator (Kẻ phân biệt) là gì?", options: ["Phân biệt xem mẫu dữ liệu đưa vào là dữ liệu thật hay do Generator tạo ra", "Sinh ra dữ liệu giả giống thật", "Nén dữ liệu về dạng vector", "Tính toán tỉ lệ học tối ưu"], answer: 0 },
            { id: 89, q: "Thuật toán K-Nearest Neighbors (k-NN) được xếp vào nhóm học máy nào do không có quá trình huấn luyện mô hình rõ ràng?", options: ["Lazy Learning (Học lười)", "Eager Learning", "Reinforcement Learning", "Self-Supervised Learning"], answer: 0 },
            // HARD QUESTION 9
            { id: 90, q: "[KHÓ] Tính giá trị Entropy $H(X)$ của một biến ngẫu nhiên nhị phân $X$ có xác suất $P(X=1) = 0.5$ và $P(X=0) = 0.5$ (sử dụng logarit cơ số 2)?", options: ["0.0 bit", "0.5 bit", "1.0 bit", "2.0 bit"], answer: 2 },
            { id: 91, q: "Khái niệm 'Data Drift' trong triển khai thực tế hệ thống AI nghĩa là gì?", options: ["Sự thay đổi theo thời gian của phân phối dữ liệu đầu vào so với dữ liệu huấn luyện", "Dữ liệu bị xóa mất khỏi cơ sở dữ liệu", "Mô hình chạy chậm hơn bình thường", "Dữ liệu bị trùng lặp nhiều lần"], answer: 0 },
            { id: 92, q: "Kiến trúc Grouped-Query Attention (GQA) được thiết kế nhằm mục đích chính nào trong các LLM hiện đại?", options: ["Cân bằng giữa chất lượng của MHA và tiết kiệm bộ nhớ KV Cache của MQA", "Thay thế hoàn toàn cơ chế Attention bằng CNN", "Xóa bỏ ma trận Key và Value", "Tăng kích thước mô hình lên 10 lần"], answer: 0 },
            { id: 93, q: "Trong đại số tuyến tính, Tích vô hướng (Dot Product) của hai vector vuông góc với nhau luôn bằng bao nhiêu?", options: ["0", "1", "-1", "Vô cùng"], answer: 0 },
            { id: 94, q: "Thư viện `transformers` của Hugging Face chủ yếu cung cấp tài nguyên nào?", options: ["Các mô hình Pre-trained State-of-the-art và công cụ xử lý dữ liệu dễ dàng", "Hệ điều hành cho robot", "Thư viện thiết kế giao diện web", "Phần mềm diệt virus AI"], answer: 0 },
            { id: 95, q: "Kỹ thuật 'Adversarial Training' giúp mô hình nâng cao khả năng chống chịu đối với hiện tượng nào?", options: ["Các cuộc tấn công nhiễu nhỏ cố tình làm sai lệch dự đoán (Adversarial Attacks)", "Tràn bộ nhớ GPU", "Mất kết nối mạng internet", "Lỗi cú pháp mã nguồn Python"], answer: 0 },
            { id: 96, q: "Khác biệt quan trọng giữa Regularization $L_1$ (Lasso) và $L_2$ (Ridge) là gì?", options: ["$L_1$ có khả năng nén trọng số của các thuộc tính không quan trọng về đúng 0", "$L_2$ luôn triệt tiêu hoàn toàn trọng số về 0", "$L_1$ khiến mô hình dễ bị Overfitting hơn", "$L_2$ chỉ áp dụng cho bài toán phân loại ảnh"], answer: 0 },
            { id: 97, q: "Trong bài toán Phân loại đa nhãn (Multi-label Classification), hàm kích hoạt nào thường được áp dụng ở lớp đầu ra cho từng nơ-ron?", options: ["Sigmoid độc lập cho mỗi đầu ra", "Softmax trên toàn bộ lớp đầu ra", "ReLU", "Tanh"], answer: 0 },
            { id: 98, q: "Khi mô hình gặp hiện tượng Underfitting (Chưa học đủ), giải pháp nào sau đây là phù hợp nhất?", options: ["Tăng độ phức tạp của mô hình hoặc thêm đặc trưng (features) mới", "Tăng hệ số Regularization lên rất cao", "Giảm số lượng epoch huấn luyện", "Xóa bớt dữ liệu huấn luyện"], answer: 0 },
            { id: 99, q: "Lớp `nn.Embedding` trong PyTorch thực chất hoạt động giống phép toán nào?", options: ["Phép tra cứu bảng (Lookup Table) biến ID số nguyên thành vector liên tục", "Phép tính tích chập 2D", "Phép nhân ma trận vuông", "Phép lấy giá trị trung bình"], answer: 0 },
            // HARD QUESTION 10
            { id: 100, q: "[KHÓ] Cho mô hình Transformer với chuỗi đầu vào độ dài $N = 1024$ tokens và kích thước chiều nhúng $d_{\\text{model}} = 768$. Ma trận Query $Q$ thu được sau phép chiếu tuyến tính có kích thước (Shape) là bao nhiêu?", options: ["$(768, 1024)$", "$(1024, 768)$", "$(1024, 1024)$", "$(768, 768)$"], answer: 1 }
        ];

        // Global State Variables
        let userAnswers = {};
        let isSubmitted = false;
        let timeRemaining = 180 * 60; // 180 minutes in seconds
        let timerInterval = null;
        let currentFilter = 'all';

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
            renderPalette();
            startTimer();
        });

        // Start Countdown Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
                    submitQuiz();
                    return;
                }
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                document.getElementById('timer').innerText = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        // Render Questions List
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const optionPrefixes = ['A', 'B', 'C', 'D'];

            questionsData.forEach((qObj, index) => {
                const qCard = document.createElement('div');
                qCard.id = `question-card-${qObj.id}`;
                qCard.className = `question-card bg-white p-6 rounded-xl shadow-sm border border-slate-200 transition duration-200`;
                qCard.dataset.questionId = qObj.id;

                let optionsHTML = '';
                qObj.options.forEach((optText, optIdx) => {
                    const isChecked = userAnswers[qObj.id] === optIdx;
                    let optionStyle = 'border-slate-200 hover:bg-slate-50';
                    let badgeHTML = '';

                    // Styling for Post-Submission Review
                    if (isSubmitted) {
                        const isUserPick = userAnswers[qObj.id] === optIdx;
                        const isCorrectAnswer = qObj.answer === optIdx;

                        if (isCorrectAnswer) {
                            optionStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                            badgeHTML = `<span class="ml-auto text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-normal"><i class="fa-solid fa-check mr-1"></i>Đáp án đúng</span>`;
                        } else if (isUserPick && !isCorrectAnswer) {
                            optionStyle = 'border-rose-500 bg-rose-50 text-rose-900 font-semibold';
                            badgeHTML = `<span class="ml-auto text-xs bg-rose-600 text-white px-2 py-0.5 rounded font-normal"><i class="fa-solid fa-xmark mr-1"></i>Đã chọn (Sai)</span>`;
                        }
                    }

                    optionsHTML += `
                        <label class="flex items-center p-3.5 border rounded-lg cursor-pointer transition ${optionStyle} ${isChecked && !isSubmitted ? 'border-indigo-600 bg-indigo-50 font-medium' : ''}">
                            <input type="radio" 
                                   name="q_${qObj.id}" 
                                   value="${optIdx}" 
                                   ${isChecked ? 'checked' : ''} 
                                   ${isSubmitted ? 'disabled' : ''} 
                                   onchange="selectOption(${qObj.id}, ${optIdx})"
                                   class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                            <span class="ml-3 text-sm font-bold text-slate-700 mr-2">${optionPrefixes[optIdx]}.</span>
                            <span class="text-sm text-slate-800 flex-grow">${optText}</span>
                            ${badgeHTML}
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <h3 class="font-bold text-base text-slate-800 leading-snug">
                            <span class="text-indigo-600">Câu ${qObj.id}:</span> ${qObj.q}
                        </h3>
                    </div>
                    <div class="space-y-2.5">
                        ${optionsHTML}
                    </div>
                `;

                container.appendChild(qCard);
            });

            // Trigger MathJax re-render
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // Render Right Navigation Palette
        function renderPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';

            questionsData.forEach(qObj => {
                const isAnswered = userAnswers.hasOwnProperty(qObj.id);
                let btnClass = 'bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200';

                if (isSubmitted) {
                    const userPick = userAnswers[qObj.id];
                    if (userPick === qObj.answer) {
                        btnClass = 'bg-emerald-500 text-white border-emerald-600 font-bold';
                    } else if (userPick !== undefined) {
                        btnClass = 'bg-rose-500 text-white border-rose-600 font-bold';
                    } else {
                        btnClass = 'bg-amber-400 text-slate-900 border-amber-500 font-bold';
                    }
                } else if (isAnswered) {
                    btnClass = 'bg-indigo-600 text-white border-indigo-700 font-bold';
                }

                const btn = document.createElement('button');
                btn.id = `palette-btn-${qObj.id}`;
                btn.className = `h-9 w-full rounded border text-xs flex items-center justify-center transition shadow-sm ${btnClass}`;
                btn.innerText = qObj.id;
                btn.onclick = () => scrollToQuestion(qObj.id);
                palette.appendChild(btn);
            });
        }

        // Option Selection Handler
        function selectOption(qId, optionIdx) {
            if (isSubmitted) return;
            userAnswers[qId] = optionIdx;
            updateProgress();
            renderPalette();

            // Highlight selected card visually
            const card = document.getElementById(`question-card-${qId}`);
            if (card) {
                card.querySelectorAll('label').forEach((lbl, idx) => {
                    if (idx === optionIdx) {
                        lbl.classList.add('border-indigo-600', 'bg-indigo-50', 'font-medium');
                    } else {
                        lbl.classList.remove('border-indigo-600', 'bg-indigo-50', 'font-medium');
                    }
                });
            }
        }

        // Update Progress Bar
        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const percent = Math.round((answeredCount / 100) * 100);
            document.getElementById('progress-text').innerText = `Tiến độ làm bài: ${answeredCount}/100 câu`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        // Scroll to Specific Question
        function scrollToQuestion(qId) {
            const qCard = document.getElementById(`question-card-${qId}`);
            if (qCard) {
                qCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                qCard.classList.add('ring-2', 'ring-indigo-500');
                setTimeout(() => qCard.classList.remove('ring-2', 'ring-indigo-500'), 1500);
            }
        }

        // Submit Confirmation
        function confirmSubmit() {
            if (isSubmitted) return;
            const answeredCount = Object.keys(userAnswers).length;
            const unanswered = 100 - answeredCount;

            let msg = `Bạn đã làm ${answeredCount}/100 câu.`;
            if (unanswered > 0) {
                msg += ` Còn ${unanswered} câu chưa trả lời.`;
            }
            msg += ` Bạn có chắc chắn muốn nộp bài?`;

            if (confirm(msg)) {
                submitQuiz();
            }
        }

        // Submit Quiz & Grade Results
        function submitQuiz() {
            isSubmitted = true;
            clearInterval(timerInterval);

            // Grade Answers
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;

            questionsData.forEach(qObj => {
                const userPick = userAnswers[qObj.id];
                if (userPick === undefined) {
                    unanswered++;
                } else if (userPick === qObj.answer) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            const score = (correct / 10).toFixed(1); // Scale of 10

            // Update UI Elements
            document.getElementById('score-val').innerText = `${score} / 10`;
            document.getElementById('correct-val').innerText = `${correct} / 100`;
            document.getElementById('wrong-val').innerText = `${wrong} / 100`;
            document.getElementById('unanswered-val').innerText = `${unanswered} / 100`;

            // Evaluation Rating
            let rating = '';
            if (score >= 9.0) rating = "🎉 Xuất sắc! Bạn có tư duy AI / Deep Learning ở trình độ Chuyên gia!";
            else if (score >= 8.0) rating = "👏 Giỏi! Kết quả vô cùng ấn tượng!";
            else if (score >= 6.5) rating = "👍 Khá! Hãy tiếp tục luyện tập thêm các dạng toán tính toán nâng cao.";
            else if (score >= 5.0) rating = "😐 Trung bình! Cần ôn tập lại các lý thuyết cốt lõi và công thức.";
            else rating = "⚠️ Chưa đạt! Cần học kỹ lại các thuật toán và kiến trúc mạng.";

            document.getElementById('rating-text').innerText = rating;
            document.getElementById('result-banner').classList.remove('hidden');

            // Hide/Disable Buttons
            document.getElementById('submit-btn-top').classList.add('hidden');
            document.getElementById('submit-btn-bottom').classList.add('hidden');

            // Re-render UI with Correct Answers Highlighted
            renderQuestions();
            renderPalette();

            // Scroll to Top Result Banner
            document.getElementById('result-banner').scrollIntoView({ behavior: 'smooth' });
        }

        // Filter Questions (All, Correct, Wrong, Unanswered)
        function filterQuestions(type) {
            currentFilter = type;
            questionsData.forEach(qObj => {
                const qCard = document.getElementById(`question-card-${qObj.id}`);
                const userPick = userAnswers[qObj.id];
                const isCorrect = userPick === qObj.answer;
                const isUnanswered = userPick === undefined;

                if (type === 'all') {
                    qCard.classList.remove('hidden');
                } else if (type === 'correct' && isCorrect) {
                    qCard.classList.remove('hidden');
                } else if (type === 'wrong' && !isCorrect && !isUnanswered) {
                    qCard.classList.remove('hidden');
                } else if (type === 'unanswered' && isUnanswered) {
                    qCard.classList.remove('hidden');
                } else {
                    qCard.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
