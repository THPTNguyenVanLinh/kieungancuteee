<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation / Header -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-brain text-yellow-400 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">OLYMPIC TRÍ TUỆ NHÂN TẠO 2026 kn cute</h1>
                    <p class="text-xs text-indigo-200">Mã đề: 006-HARD | Tổng số câu: 100</p>
                </div>
            </div>

            <!-- Timer & Actions -->
            <div class="flex items-center space-x-6">
                <div class="flex items-center bg-indigo-950 px-3 py-1.5 rounded-lg border border-indigo-700">
                    <i class="fa-regular fa-clock text-yellow-400 mr-2"></i>
                    <span id="timer" class="font-mono font-bold text-lg text-yellow-300">180:00</span>
                </div>
                <button id="submit-btn-top" onclick="confirmSubmit()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg transition shadow-md flex items-center">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp Bài
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-6 flex-grow flex flex-col lg:flex-row gap-6 w-full">

        <!-- Left Column: Questions List -->
        <main class="lg:w-3/4 flex-grow space-y-6">

            <!-- Progress Bar -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between text-sm font-semibold mb-2">
                    <span id="progress-text">Tiến độ làm bài: 0/100 câu</span>
                    <span id="progress-percent" class="text-indigo-600">0%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Score Summary Banner (Hidden by default, shows after submission) -->
            <div id="result-banner" class="hidden bg-white p-6 rounded-xl shadow-md border-2 border-indigo-500 text-center space-y-4">
                <h2 class="text-2xl font-bold text-indigo-900">KẾT QUẢ BÀI THI</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-2xl mx-auto">
                    <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                        <div class="text-xs text-indigo-600 font-semibold uppercase">Điểm số</div>
                        <div id="score-val" class="text-2xl font-extrabold text-indigo-800">0 / 10</div>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                        <div class="text-xs text-emerald-600 font-semibold uppercase">Số câu đúng</div>
                        <div id="correct-val" class="text-2xl font-extrabold text-emerald-700">0 / 100</div>
                    </div>
                    <div class="bg-rose-50 p-3 rounded-lg border border-rose-100">
                        <div class="text-xs text-rose-600 font-semibold uppercase">Số câu sai</div>
                        <div id="wrong-val" class="text-2xl font-extrabold text-rose-700">0 / 100</div>
                    </div>
                    <div class="bg-amber-50 p-3 rounded-lg border border-amber-100">
                        <div class="text-xs text-amber-600 font-semibold uppercase">Bỏ trống</div>
                        <div id="unanswered-val" class="text-2xl font-extrabold text-amber-700">0 / 100</div>
                    </div>
                </div>
                <div id="rating-text" class="text-lg font-semibold text-slate-700"></div>

                <!-- Review Filter Buttons -->
                <div class="flex flex-wrap justify-center gap-2 pt-2 border-t border-slate-200">
                    <button onclick="filterQuestions('all')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-indigo-600 text-white">Tất cả</button>
                    <button onclick="filterQuestions('correct')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-100 text-emerald-800 hover:bg-emerald-200">Chỉ câu đúng</button>
                    <button onclick="filterQuestions('wrong')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-rose-100 text-rose-800 hover:bg-rose-200">Chỉ câu sai</button>
                    <button onclick="filterQuestions('unanswered')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-amber-100 text-amber-800 hover:bg-amber-200">Chưa làm</button>

            <!-- Questions Rendering Container -->
            <div id="questions-container" class="space-y-6">

            </div>

            <div class="text-center py-4">
                <button id="submit-btn-bottom" onclick="confirmSubmit()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg px-8 py-3 rounded-xl transition shadow-lg inline-flex items-center">
                    <i class="fa-solid fa-paper-plane mr-3"></i> Nộp Bài Ngay
                </button>
            </div>
        </main>

        <!-- Right Column: Navigation Palette / Overview -->
        <aside class="lg:w-1/4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 sticky top-20 space-y-4">
                <h3 class="font-bold text-slate-700 text-sm flex items-center justify-between border-b pb-2">
                    <span><i class="fa-solid fa-th-large mr-2 text-indigo-600"></i> BẢNG CÂU HỎI</span>
                    <span id="palette-count" class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-500">100 Câu</span>

                    <div class="flex items-center"><span class="w-3 h-3 bg-indigo-600 rounded-sm mr-1.5"></span> Đã chọn</div>
                    <div class="flex items-center"><span class="w-3 h-3 bg-emerald-500 rounded-sm mr-1.5"></span> Đúng</div>
                    <div class="flex items-center"><span class="w-3 h-3 bg-rose-500 rounded-sm mr-1.5"></span> Sai</div>
                </div>

                <!-- Palette Grid (1-100) -->
                <div id="question-palette" class="grid grid-cols-5 sm:grid-cols-10 lg:grid-cols-5 gap-1.5 max-h-[60vh] overflow-y-auto custom-scrollbar p-1">
                    <!-- Dynamically generated via JS -->
                </div>
            </div>
        </aside>
    </div>

    <!-- Script Logic & Data -->
    <script>
        // Data of 100 questions conforming to official VOAI syllabus
        const questionsData = [
            // ==================== PHẦN I: MACHINE LEARNING CỔ ĐIỂN & TOÁN CHO AI (1 - 25) ====================
            { id: 1, q: "Cho Ma trận nhầm lẫn (Confusion Matrix): $TP = 80$, $FP = 20$, $FN = 20$, $TN = 880$. Giá trị chỉ số $F_1$-Score của mô hình bằng bao nhiêu?", options: ["$0.800$", "$0.880$", "$0.750$", "$0.833$"], answer: 0 },
            { id: 2, q: "Cho tập dữ liệu $S$ gồm 8 mẫu thuộc Lớp A và 8 mẫu thuộc Lớp B. Độ đo Entropy $H(S)$ tính theo đơn vị bit bằng bao nhiêu?", options: ["$1.000$", "$0.500$", "$0.000$", "$0.811$"], answer: 0 },
            { id: 3, q: "Gradient $\\nabla f(x, y)$ của hàm số $f(x, y) = x^2 + 3xy + y^2$ tại điểm $(1, 2)$ có tọa độ là:", options: ["$(8, 7)$", "$(5, 7)$", "$(8, 5)$", "$(2, 3)$"], answer: 0 },
            { id: 4, q: "Trong thuật toán k-NN với $k = 3$, khoảng cách từ điểm truy vấn $Q$ đến 3 điểm lân cận lần lượt là $d_1 = 1$, $d_2 = 2$, $d_3 = 4$ với nhãn tương ứng $(+, -, -)$. Nếu dùng trọng số $w_i = 1 / d_i$, điểm $Q$ được gán nhãn nào?", options: ["Nhãn (+)", "Nhãn (-)", "Hòa nhãn", "Không xác định"], answer: 0 },
            { id: 5, q: "Khoảng cách Euclidean giữa hai điểm $A(1, 2, 3)$ và $B(4, 6, 3)$ trong không gian 3 chiều bằng:", options: ["$5.0$", "$4.0$", "$7.0$", "$\\sqrt{13}$"], answer: 0 },
            { id: 6, q: "Khoảng cách Manhattan (L1 distance) giữa hai vector $u = [2, -3, 5]$ và $v = [-1, 1, 2]$ bằng:", options: ["$10$", "$\\sqrt{34}$", "$8$", "$12$"], answer: 0 },
            { id: 7, q: "Cho hai vector $a = [1, 2]$ và $b = [3, 4]$. Giá trị tích vô hướng $a \\cdot b$ và độ đo Cosine Similarity $\\cos(a, b)$ lần lượt là:", options: ["$11$ và $0.984$", "$10$ và $0.800$", "$11$ và $0.894$", "$14$ và $0.984$"], answer: 0 },
            { id: 8, q: "Chuẩn hóa Z-score cho giá trị $x = 18$ trong tập dữ liệu có trung bình $\\mu = 12$ và độ lệch chuẩn $\\sigma = 3.0$ thu được giá trị $z$ bằng:", options: ["$2.0$", "$1.5$", "$3.0$", "$0.5$"], answer: 0 },
            { id: 9, q: "Cho hai ma trận $A = \\begin{bmatrix} 2 & 1 \\\\ 0 & 3 \\end{bmatrix}$ và $B = \\begin{bmatrix} 1 & 2 \\\\ 4 & 0 \\end{bmatrix}$. Phần tử nằm ở hàng 1 cột 1 của ma trận tích $C = A \\times B$ bằng:", options: ["$6$", "$8$", "$10$", "$2$"], answer: 0 },
            { id: 10, q: "Trong thuật toán K-Means 2D, một cụm gồm 3 điểm: $(1, 2)$, $(3, 6)$, $(5, 1)$. Tọa độ tâm cụm (Centroid) mới cập nhật là:", options: ["$(3, 3)$", "$(3, 4)$", "$(2.5, 3)$", "$(3, 2.5)$"], answer: 0 },
            { id: 11, q: "Đạo hàm của hàm kích hoạt Sigmoid $\\sigma(z) = \\frac{1}{1 + e^{-z}}$ tại $z = 0$ có giá trị bằng:", options: ["$0.25$", "$0.50$", "$1.00$", "$0.00$"], answer: 0 },
            { id: 12, q: "Một mô hình phân loại nhị phân thu được $TP = 40, FP = 10, FN = 10, TN = 40$. Giá trị Accuracy và Recall lần lượt là:", options: ["$80\\%, 80\\%$", "$80\\%, 75\\%$", "$75\\%, 80\\%$", "$85\\%, 80\\%$"], answer: 0 },
            { id: 13, q: "Trong thuật toán SVM tuyến tính, nếu vector trọng số tìm được là $w = [3, 4]$ thì độ rộng lề (margin) $2 / \\|w\\|_2$ bằng:", options: ["$0.4$", "$0.5$", "$0.25$", "$0.2$"], answer: 0 },
            { id: 14, q: "Áp dụng Chính quy hóa L2 (Ridge) với hệ số $\\lambda = 0.1$ cho vector trọng số $w = [3, -4]$, giá trị đại lượng phạt $\\frac{1}{2} \\lambda \\|w\\|_2^2$ bằng:", options: ["$1.25$", "$2.50$", "$0.25$", "$5.00$"], answer: 0 },
            { id: 15, q: "Khi lấy mẫu Bootstrap có thay thế trên $N$ phần tử, tỷ lệ trung bình các mẫu gốc KHÔNG xuất hiện trong tập bootstrap khi $N \\to \\infty$ tiến tới:", options: ["$1/e \\approx 36.8\\%$", "$50.0\\%", "$1 - 1/e \\approx 63.2\\%", "$25.0\\%"], answer: 0 },
            { id: 16, q: "Nếu tập dữ liệu có $99\\%$ nhãn Âm tính và $1\\%$ Dương tính, một mô hình luôn dự đoán nhãn Âm tính sẽ thu được:", options: ["Accuracy = $99\\%$, F1-score = $0.0$", "Accuracy = $99\\%$, F1-score = $0.99$", "Accuracy = $50\\%$, F1-score = $0.0$", "Accuracy = $0\\%$, F1-score = $0.0$"], answer: 0 },
            { id: 17, q: "Độ đo Gini Impurity $1 - \\sum p_i^2$ cho một nút chứa 2 lớp có tỷ lệ đồng đều $p_1 = p_2 = 0.5$ có giá trị bằng:", options: ["$0.50$", "$0.25$", "$1.00$", "$0.00$"], answer: 0 },
            { id: 18, q: "Trong thuật toán DBSCAN với $\\epsilon = 2.0$ và $MinPts = 4$, điểm $A$ có 5 điểm thuộc lân cận bán kính $\\epsilon$. Phát biểu nào sau đây ĐÚNG?", options: ["$A$ là Điểm lõi (Core Point)", "$A$ là Điểm biên (Border Point)", "$A$ là Điểm nhiễu (Noise Point)", "Chưa đủ thông tin kết luận"], answer: 0 },
            { id: 19, q: "Thuật toán PCA (Principal Component Analysis) thực hiện chéo hóa ma trận nào để tìm trục thành phần chính?", options: ["Ma trận hiệp phương sai (Covariance Matrix)", "Ma trận nghịch đảo", "Ma trận nhầm lẫn", "Ma trận đơn vị"], answer: 0 },
            { id: 20, q: "Phát biểu nào sau đây mô tả ĐÚNG nguyên lý hoạt động của phương pháp Bagging (Rừng ngẫu nhiên)?", options: ["Huấn luyện các mô hình độc lập song song trên các tập dữ liệu bootstrap", "Huấn luyện các mô hình tuần tự, cây sau sửa lỗi cây trước", "Chỉ áp dụng cho bài toán hồi quy", "Tự động giảm độ thiên lệch (bias) của mô hình gốc"], answer: 0 },
            { id: 21, q: "Phương pháp Gradient Boosting (XGBoost) hoạt động dựa trên nguyên lý cốt lõi nào?", options: ["Xây dựng các cây quyết định nối tiếp, cây sau dự đoán phần dư (residual error) của cây trước", "Huấn luyện các cây độc lập song song", "Phân cụm dữ liệu trước khi hồi quy", "Lấy mẫu không thay thế"], answer: 0 },
            { id: 22, q: "Giả định cơ bản nhất của thuật toán Naive Bayes là gì?", options: ["Các đặc trưng hoàn toàn độc lập với nhau khi biết nhãn lớp", "Dữ liệu tuân theo phân phối chuẩn", "Không chứa giá trị ngoại lệ (outliers)", "Các đặc trưng có cùng đơn vị đo"], answer: 0 },
            { id: 23, q: "Độ đo khoảng cách Mahalanobis giữa $x$ và $\\mu$ với ma trận hiệp phương sai $S = I$ (ma trận đơn vị) tương đương với:", options: ["Khoảng cách Euclidean", "Khoảng cách Manhattan", "Cosine Distance", "Jaccard Distance"], answer: 0 },
            { id: 24, q: "Khi huấn luyện dữ liệu bị mất cân bằng nhãn nghiêm trọng (imbalanced data), chiến lược nào sau đây LÀ PHÙ HỢP?", options: ["Sử dụng Weighted Cross-Entropy Loss hoặc SMOTE", "Chỉ dùng Accuracy để đánh giá mô hình", "Loại bỏ hoàn toàn các mẫu thuộc lớp thiểu số", "Giảm số epoch huấn luyện"], answer: 0 },
            { id: 25, q: "Biểu diễn hàm dự đoán của thuật toán Random Forest cho bài toán hồi quy với $K$ cây quyết định $T_i(x)$ là:", options: ["$y(x) = \\frac{1}{K} \\sum_{i=1}^K T_i(x)$", "$y(x) = \\sum_{i=1}^K T_i(x)$", "$y(x) = \\max_{i} T_i(x)$", "$y(x) = T_1(x)$"], answer: 0 },

            // ==================== PHẦN II: DEEP LEARNING & PYTORCH WORKFLOWS (26 - 55) ====================
            { id: 26, q: "Trong PyTorch, thực thi đoạn mã: `x = torch.ones(3, 4); y = x.view(2, -1)`. Kích thước `y.shape` thu được là:", options: ["torch.Size([2, 6])", "torch.Size([2, 4])", "torch.Size([3, 8])", "RuntimeError"], answer: 0 },
            { id: 27, q: "Cho đoạn mã Autograd trong PyTorch: `x = torch.tensor(3.0, requires_grad=True); y = 2*x**3 + 5; y.backward()`. Giá trị `x.grad` thu được là:", options: ["$54.0$", "$18.0$", "$27.0$", "$59.0$"], answer: 0 },
            { id: 28, q: "Cho nơ-ron có đầu vào $x = [2, -3, 1]$, trọng số $w = [0.5, 1.0, 2.0]$, bias $b = 0.5$, hàm kích hoạt ReLU. Đầu ra $y$ bằng:", options: ["$0.5$", "$0.0$", "$1.5$", "$2.0$"], answer: 0 },
            { id: 29, q: "Tổng số tham số có thể huấn luyện (trainable params) của lớp `nn.Linear(in_features=512, out_features=128, bias=True)` là:", options: ["$65,664$", "$65,536$", "$65,408$", "$131,072$"], answer: 0 },
            { id: 30, q: "Trong PyTorch, thực thi đoạn mã: `x = torch.randn(4, 3, 32, 32); y = x.permute(0, 2, 3, 1)`. Shape của tensor `y` là:", options: ["torch.Size([4, 32, 32, 3])", "torch.Size([4, 3, 32, 32])", "torch.Size([32, 32, 4, 3])", "torch.Size([3, 4, 32, 32])"], answer: 0 },
            { id: 31, q: "Cho mini-batch có trung bình $\\mu = 4$, phương sai $\\sigma^2 = 9$. Với $x = 7$, $\\gamma = 2$, $\\beta = 1, \\epsilon = 0$, đầu ra $BatchNorm(x)$ bằng:", options: ["$3.0$", "$2.0$", "$4.0$", "$1.0$"], answer: 0 },
            { id: 32, q: "Trong PyTorch, nếu quên gọi `optimizer.zero_grad()` trước bước lan truyền ngược, hiện tượng gì sẽ xảy ra?", options: ["Gradient của các batch trước sẽ cộng dồn vào batch hiện tại", "Trọng số không được cập nhật", "Báo lỗi NullPointerException", "Loss tự động giảm về 0"], answer: 0 },
            { id: 33, q: "Huấn luyện mô hình 7B tham số dạng FP16. Bộ tối ưu Adam tiêu tốn 12 bytes/param. Bộ nhớ VRAM tối thiểu cho Trọng số + Gradient + Optimizer là:", options: ["$112$ GB", "$14$ GB", "$28$ GB", "$56$ GB"], answer: 0 },
            { id: 34, q: "Chiến lược Learning Rate Warmup tăng tuyến tính từ $0$ lên $0.001$ trong $1000$ steps. Tại step thứ $400$, giá trị Learning Rate là:", options: ["$0.0004$", "$0.0001$", "$0.0005$", "$0.0008$"], answer: 0 },
            { id: 35, q: "Thực thi đoạn mã: `a = torch.tensor([2.0], requires_grad=True); b = a**2; c = b * 3; c.backward()`. Giá trị `a.grad` thu được là:", options: ["$12.0$", "$6.0$", "$4.0$", "$3.0$"], answer: 0 },
            { id: 36, q: "Lớp Gradient Clipping nén norm gradient $g$ về $max\\_norm = 5.0$. Nếu $\|g\|_2 = 10.0$, vector gradient mới $g'$ bằng:", options: ["$0.5 \\times g$", "$2.0 \\times g$", "$g$", "$5.0 \\times g$"], answer: 0 },
            { id: 37, q: "Khởi tạo Kaiming (He) Normal cho lớp tuyến tính có `in_features = 100` sử dụng phương sai $\\sigma^2$ bằng:", options: ["$2 / 100 = 0.02$", "$1 / 100 = 0.01$", "$2 / 200 = 0.01$", "$1 / 50 = 0.02$"], answer: 0 },
            { id: 38, q: "Kỹ thuật Gradient Accumulation với $k = 4$ steps và Batch Size $16$ tương đương huấn luyện với Batch Size hiệu dụng bằng:", options: ["$64$", "$16$", "$32$", "$128$"], answer: 0 },
            { id: 39, q: "Để tiết kiệm VRAM và tăng tốc độ khi chạy suy luận (Inference) trong PyTorch, khối mã chuẩn được khuyên dùng là:", options: ["`with torch.no_grad():` kết hợp `model.eval()`", "`with torch.eval():` kết hợp `model.no_grad()`", "`with torch.freeze():`", "`with torch.autograd.disable():`"], answer: 0 },
            { id: 40, q: "Trong PyTorch, lệnh `torch.cat([x, y], dim=0)` với `x.shape = (2, 3)` và `y.shape = (4, 3)` cho ra shape:", options: ["torch.Size([6, 3])", "torch.Size([2, 7])", "torch.Size([2, 4, 3])", "RuntimeError"], answer: 0 },

            { id: 56, q: "Cho ảnh đầu vào kích thước $1 \\times 3 \\times 64 \\times 64$. Qua lớp `nn.Conv2d(3, 32, kernel_size=5, stride=2, padding=2)`, kích thước không gian đầu ra là:", options: ["$32 \\times 32$", "$30 \\times 30$", "$31 \\times 31$", "$16 \\times 16$"], answer: 0 },

            { id: 62, q: "Tính tích chập 2D tại vị trí góc trái trên: Ảnh $3 \\times 3 = \\begin{bmatrix} 1 & 2 & 0 \\\\ 0 & 1 & 1 \\\\ 2 & 0 & 1 \\end{bmatrix}$, Kernel $2 \\times 2 = \\begin{bmatrix} 1 & 0 \\\\ -1 & 2 \\end{bmatrix}$ (no bias). Kết quả là:", options: ["$3$", "$1$", "$2$", "$5$"], answer: 0 },
            { id: 63, q: "Áp dụng Max Pooling $2 \\times 2$ stride $2$ trên ma trận $4 \\times 4 = \\begin{bmatrix} 1 & 3 & 2 & 4 \\\\ 5 & 6 & 1 & 0 \\\\ 0 & 2 & 8 & 7 \\\\ 1 & 4 & 3 & 9 \\end{bmatrix}$. Ma trận đầu ra thu được là:", options: ["$\\begin{bmatrix} 6 & 4 \\\\ 4 & 9 \\end{bmatrix}$", "$\\begin{bmatrix} 5 & 4 \\\\ 2 & 8 \\end{bmatrix}$", "$\\begin{bmatrix} 6 & 2 \\\\ 4 & 9 \\end{bmatrix}$", "$\\begin{bmatrix} 1 & 0 \\\\ 0 & 3 \\end{bmatrix}$"], answer: 0 },
            { id: 64, q: "Mô hình YOLOv1 chia lưới $7 \\times 7$, mỗi ô lưới dự đoán $B = 2$ Bounding Boxes và $C = 20$ lớp. Kích thước tensor đầu ra cuối cùng là:", options: ["$7 \\times 7 \\times 30$", "$7 \\times 7 \\times 25$", "$7 \\times 7 \\times 1024$", "$14 \\times 14 \\times 30$"], answer: 0 },

            { id: 66, q: "Trong Focal Loss $FL(p_t) = -(1 - p_t)^2 \\log(p_t)$, khi mẫu dễ có $p_t = 0.9$, hệ số đè nén $(1 - p_t)^2$ làm giảm trọng số loss đi bao nhiêu lần so với mẫu $p_t = 0.5$?", options: ["$25$ lần", "$5$ lần", "$10$ lần", "$100$ lần"], answer: 0 },

            { id: 92, q: "Kỹ thuật GPTQ (Post-Training Quantization) nén trọng số LLM từ FP16 xuống INT4 chủ yếu dựa trên nguyên lý nào?", options: ["Giải bài toán tối ưu bình phương tối thiểu thứ cấp (Second-order Error Compensation) trên ma trận Hessian", "Xóa ngẫu nhiên 75% trọng số", "Cắt bỏ các lớp Decoder cuối", "Làm tròn đơn thuần cận trên/cận dưới"], answer: 0 },
            { id: 93, q: "Trong Nucleus (Top-p) Sampling với $p = 0.9$, mô hình chọn ra tập các token ứng viên bằng cách:", options: ["Lấy tập các token có tổng xác suất tích lũy vừa đủ đạt $0.9$", "Lấy cố định 90% số token trong từ vựng", "Chỉ chọn token có xác suất $> 0.9$", "Lấy Top 9 token đầu tiên"], answer: 0 },
            { id: 94, q: "Điểm khác biệt chính giữa chỉ số BLEU và ROUGE trong đánh giá văn bản là:", options: ["BLEU hướng tới Precision (tỷ lệ n-gram dự đoán nằm trong đáp án); ROUGE hướng tới Recall (tỷ lệ n-gram đáp án xuất hiện trong dự đoán)", "BLEU dùng cho phân loại; ROUGE dùng cho tóm tắt", "BLEU đo độ dài câu; ROUGE đo độ tương đồng cosine", "Cả hai hoàn toàn giống nhau về công thức"], answer: 0 },
            { id: 95, q: "Kỹ thuật Zero-shot Chain-of-Thought (CoT) kích hoạt khả năng suy luận của LLM bằng cách thêm câu thoại nào vào Prompt?", options: ["\"Let's think step by step.\"", "\"Answer in one word.\"", "\"Repeat the question.\"", "\"Be as concise as possible.\""], answer: 0 },
            { id: 96, q: "Hiện tượng Triệt tiêu Gradient (Vanishing Gradient) trong mạng RNN truyền thống xảy ra khi nhân liên tiếp ma trận trọng số $W_{hh}$ qua $T$ bước thời gian có giá trị riêng lớn nhất:", options: ["$< 1.0$", "$> 1.0$", "$= 1.0$", "$= 0.0$"], answer: 0 },
            { id: 97, q: "Kỹ thuật Speculative Decoding tăng tốc độ sinh chuỗi LLM bằng cách nào?", options: ["Dùng mô hình nhỏ (Draft Model) sinh nhanh một chuỗi token gợi ý, sau đó LLM lớn kiểm tra song song trong 1 bước", "Chạy 2 GPU song song cho 1 token", "Bỏ qua lớp Attention ở các token lẻ", "Giảm Sequence Length"], answer: 0 },
            { id: 98, q: "Trong khối Multi-Head Attention với $d_{model} = 4096$, tổng số tham số trainable của 4 ma trận chiếu trọng số $W_Q, W_K, W_V, W_O$ (không tính bias) là:", options: ["$4 \\times 4096^2 = 67,108,864$", "$2 \\times 4096^2$", "$4096^2$", "$8 \\times 4096^2$"], answer: 0 },
            { id: 99, q: "Phương pháp ALiBi (Attention with Linear Biases) mở rộng Context Window cho Transformer bằng cách nào?", options: ["Trừ một giá trị phạt tuyến tính tăng theo khoảng cách giữa các token vào ma trận Attention Score trước Softmax", "Xoay vector Query Key theo góc phức", "Tăng gấp đôi kích thước n-gram", "Tỉa bớt các token cũ"], answer: 0 },
            { id: 100, q: "Trong thư viện Hugging Face Transformers, phương thức chuyển đổi danh sách các token ID quay trở lại chuỗi văn bản đọc được là:", options: ["`tokenizer.decode(token_ids)`", "`tokenizer.encode(token_ids)`", "`tokenizer.convert_to_text(token_ids)`", "`tokenizer.to_string(token_ids)`"], answer: 0 }
        ];

        // Global State Variables
        let userAnswers = {};
        let isSubmitted = false;
        let timeRemaining = 180 * 60; // 180 minutes in seconds
        let timerInterval = null;
        let currentFilter = 'all';

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
            renderPalette();
            startTimer();
        });

        // Start Countdown Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
                    submitQuiz();
                    return;
                }
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                document.getElementById('timer').innerText = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        // Render Questions List
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const optionPrefixes = ['A', 'B', 'C', 'D'];

            questionsData.forEach((qObj, index) => {
                const qCard = document.createElement('div');
                qCard.id = `question-card-${qObj.id}`;
                qCard.className = `question-card bg-white p-6 rounded-xl shadow-sm border border-slate-200 transition duration-200`;
                qCard.dataset.questionId = qObj.id;

                let optionsHTML = '';
                qObj.options.forEach((optText, optIdx) => {
                    const isChecked = userAnswers[qObj.id] === optIdx;
                    let optionStyle = 'border-slate-200 hover:bg-slate-50';
                    let badgeHTML = '';

                    // Styling for Post-Submission Review
                    if (isSubmitted) {
                        const isUserPick = userAnswers[qObj.id] === optIdx;
                        const isCorrectAnswer = qObj.answer === optIdx;

                        if (isCorrectAnswer) {
                            optionStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                            badgeHTML = `<span class="ml-auto text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-normal"><i class="fa-solid fa-check mr-1"></i>Đáp án đúng</span>`;
                        } else if (isUserPick && !isCorrectAnswer) {
                            optionStyle = 'border-rose-500 bg-rose-50 text-rose-900 font-semibold';
                            badgeHTML = `<span class="ml-auto text-xs bg-rose-600 text-white px-2 py-0.5 rounded font-normal"><i class="fa-solid fa-xmark mr-1"></i>Đã chọn (Sai)</span>`;
                        }
                    }

                    optionsHTML += `
                        <label class="flex items-center p-3.5 border rounded-lg cursor-pointer transition ${optionStyle} ${isChecked && !isSubmitted ? 'border-indigo-600 bg-indigo-50 font-medium' : ''}">
                            <input type="radio" 
                                   name="q_${qObj.id}" 
                                   value="${optIdx}" 
                                   ${isChecked ? 'checked' : ''} 
                                   ${isSubmitted ? 'disabled' : ''} 
                                   onchange="selectOption(${qObj.id}, ${optIdx})"
                                   class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                            <span class="ml-3 text-sm font-bold text-slate-700 mr-2">${optionPrefixes[optIdx]}.</span>
                            <span class="text-sm text-slate-800 flex-grow">${optText}</span>
                            ${badgeHTML}
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <h3 class="font-bold text-base text-slate-800 leading-snug">
                            <span class="text-indigo-600">Câu ${qObj.id}:</span> ${qObj.q}
                        </h3>
                    </div>
                    <div class="space-y-2.5">
                        ${optionsHTML}
                    </div>
                `;

                container.appendChild(qCard);
            });

            // Trigger MathJax re-render
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // Render Right Navigation Palette
        function renderPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';

            questionsData.forEach(qObj => {
                const isAnswered = userAnswers.hasOwnProperty(qObj.id);
                let btnClass = 'bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200';

                if (isSubmitted) {
                    const userPick = userAnswers[qObj.id];
                    if (userPick === qObj.answer) {
                        btnClass = 'bg-emerald-500 text-white border-emerald-600 font-bold';
                    } else if (userPick !== undefined) {
                        btnClass = 'bg-rose-500 text-white border-rose-600 font-bold';
                    } else {
                        btnClass = 'bg-amber-400 text-slate-900 border-amber-500 font-bold';
                    }
                } else if (isAnswered) {
                    btnClass = 'bg-indigo-600 text-white border-indigo-700 font-bold';
                }

                const btn = document.createElement('button');
                btn.id = `palette-btn-${qObj.id}`;
                btn.className = `h-9 w-full rounded border text-xs flex items-center justify-center transition shadow-sm ${btnClass}`;
                btn.innerText = qObj.id;
                btn.onclick = () => scrollToQuestion(qObj.id);
                palette.appendChild(btn);
            });
        }

        // Option Selection Handler
        function selectOption(qId, optionIdx) {
            if (isSubmitted) return;
            userAnswers[qId] = optionIdx;
            updateProgress();
            renderPalette();

            // Highlight selected card visually
            const card = document.getElementById(`question-card-${qId}`);
            if (card) {
                card.querySelectorAll('label').forEach((lbl, idx) => {
                    if (idx === optionIdx) {
                        lbl.classList.add('border-indigo-600', 'bg-indigo-50', 'font-medium');
                    } else {
                        lbl.classList.remove('border-indigo-600', 'bg-indigo-50', 'font-medium');
                    }
                });
            }
        }

        // Update Progress Bar
        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const percent = Math.round((answeredCount / 100) * 100);
            document.getElementById('progress-text').innerText = `Tiến độ làm bài: ${answeredCount}/100 câu`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        // Scroll to Specific Question
        function scrollToQuestion(qId) {
            const qCard = document.getElementById(`question-card-${qId}`);
            if (qCard) {
                qCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                qCard.classList.add('ring-2', 'ring-indigo-500');
                setTimeout(() => qCard.classList.remove('ring-2', 'ring-indigo-500'), 1500);
            }
        }

        // Submit Confirmation
        function confirmSubmit() {
            if (isSubmitted) return;
            const answeredCount = Object.keys(userAnswers).length;
            const unanswered = 100 - answeredCount;

            let msg = `Bạn đã làm ${answeredCount}/100 câu.`;
            if (unanswered > 0) {
                msg += ` Còn ${unanswered} câu chưa trả lời.`;
            }
            msg += ` Bạn có chắc chắn muốn nộp bài?`;

            if (confirm(msg)) {
                submitQuiz();
            }
        }

        // Submit Quiz & Grade Results
        function submitQuiz() {
            isSubmitted = true;
            clearInterval(timerInterval);

            // Grade Answers
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;

            questionsData.forEach(qObj => {
                const userPick = userAnswers[qObj.id];
                if (userPick === undefined) {
                    unanswered++;
                } else if (userPick === qObj.answer) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            const score = (correct / 10).toFixed(1); // Scale of 10

            // Update UI Elements
            document.getElementById('score-val').innerText = `${score} / 10`;
            document.getElementById('correct-val').innerText = `${correct} / 100`;
            document.getElementById('wrong-val').innerText = `${wrong} / 100`;
            document.getElementById('unanswered-val').innerText = `${unanswered} / 100`;

            // Evaluation Rating
            let rating = '';
            if (score >= 9.0) rating = "🎉 Xuất sắc! Bạn có tư duy AI / Deep Learning ở trình độ Chuyên gia VOAI!";
            else if (score >= 8.0) rating = "👏 Giỏi! Kết quả vô cùng ấn tượng!";
            else if (score >= 6.5) rating = "👍 Khá! Hãy tiếp tục luyện tập thêm các dạng toán tính toán nâng cao.";
            else if (score >= 5.0) rating = "😐 Trung bình! Cần ôn tập lại các lý thuyết cốt lõi và công thức.";
            else rating = "⚠️ Chưa đạt! Cần học kỹ lại các thuật toán và kiến trúc mạng.";

            document.getElementById('rating-text').innerText = rating;
            document.getElementById('result-banner').classList.remove('hidden');

            // Hide/Disable Buttons
            document.getElementById('submit-btn-top').classList.add('hidden');
            document.getElementById('submit-btn-bottom').classList.add('hidden');

            // Re-render UI with Correct Answers Highlighted
            renderQuestions();
            renderPalette();

            // Scroll to Top Result Banner
            document.getElementById('result-banner').scrollIntoView({ behavior: 'smooth' });
        }

        // Filter Questions (All, Correct, Wrong, Unanswered)
        function filterQuestions(type) {
            currentFilter = type;
            questionsData.forEach(qObj => {
                const qCard = document.getElementById(`question-card-${qObj.id}`);
                const userPick = userAnswers[qObj.id];
                const isCorrect = userPick === qObj.answer;
                const isUnanswered = userPick === undefined;

                if (type === 'all') {
                    qCard.classList.remove('hidden');
                } else if (type === 'correct' && isCorrect) {
                    qCard.classList.remove('hidden');
                } else if (type === 'wrong' && !isCorrect && !isUnanswered) {
                    qCard.classList.remove('hidden');
                } else if (type === 'unanswered' && isUnanswered) {
                    qCard.classList.remove('hidden');
                } else {
                    qCard.classList.add('hidden');
                }
            });
        }
    </script>
