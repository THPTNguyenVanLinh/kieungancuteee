        { id: 89, q: "Phương pháp Xác thực chéo K-Fold (K-Fold Cross-Validation) giúp ích gì?", options: ["Đánh giá hiệu suất mô hình một cách khách quan, giảm thiểu thiên lệch do chia dữ liệu ngẫu nhiên", "Tăng tốc độ huấn luyện mô hình gấp K lần", "Tự động tìm kiếm siêu tham số tốt nhất", "Giảm số lượng tham số của mô hình"], answer: 0 },
        { id: 90, q: "Đường cong ROC thể hiện mối quan hệ giữa hai đại lượng nào?", options: ["True Positive Rate (TPR) và False Positive Rate (FPR)", "Precision và Recall", "Training Loss và Validation Loss", "Accuracy và Epochs"], answer: 0 },
        { id: 91, q: "Chỉ số AUC (Area Under the Curve) của đường cong ROC bằng 1.0 thể hiện điều gì?", options: ["Mô hình phân loại hoàn hảo tuyệt đối", "Mô hình phân loại hoàn toàn sai", "Mô hình bị Overfitting nặng", "Dữ liệu bị mất cân bằng nhãn"], answer: 0 },

        { id: 93, q: "Kỹ thuật SMOTE được dùng để làm gì trong xử lý dữ liệu mất cân bằng?", options: ["Tạo thêm các mẫu giả lập cho lớp yếu số (Minority Class Over-sampling)", "Xóa bớt các mẫu ở lớp đa số", "Chuẩn hóa các thuộc tính về khoảng [0, 1]", "Giảm số chiều dữ liệu"], answer: 0 },

        // TOÁN HỌC CHO AI (96-100)
        { id: 96, q: "Tích vô hướng (Dot Product) của hai vector vuông góc với nhau bằng bao nhiêu?", options: ["0", "1", "-1", "Vô cùng"], answer: 0 },
        { id: 97, q: "Trong Đại số tuyến tính, Định danh (Determinant) của một ma trận bằng 0 cho biết điều gì?", options: ["Ma trận đó suy biến và KHÔNG có ma trận nghịch đảo", "Ma trận đó là ma trận đơn vị", "Các hàng của ma trận độc lập tuyến tính", "Ma trận luôn đối xứng"], answer: 0 },
        { id: 98, q: "Gradient của một hàm số nhiều biến tại một điểm chỉ ra hướng nào?", options: ["Hướng tăng nhanh nhất của hàm số tại điểm đó", "Hướng giảm nhanh nhất của hàm số", "Hướng vuông góc với tiếp tuyến", "Hướng không làm thay đổi giá trị hàm số"], answer: 0 },
        { id: 99, q: "Độ tương đồng Cosine (Cosine Similarity) giữa hai vector cùng hướng bằng bao nhiêu?", options: ["1.0", "0.0", "-1.0", "0.5"], answer: 0 },
        { id: 100, q: "Phân phối xác suất nào có dạng hình chuông đối xứng và được định nghĩa bởi Trung bình ($\\mu$) và Phương sai ($\\sigma^2$)?", options: ["Phân phối chuẩn (Gaussian / Normal Distribution)", "Phân phối Poisson", "Phân phối Bernoulli", "Phân phối Đều (Uniform Distribution)"], answer: 0 }
    ];

    // State Variables
    let userAnswers = {};
    let isSubmitted = false;
    let timeRemaining = 180 * 60; // 180 Mins
    let timerInterval = null;

    // On Page Load
    window.addEventListener('DOMContentLoaded', () => {
        renderQuestions();
        renderPalette();
        startTimer();
    });

    // Timer Functionality
    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("Thời gian làm bài đã kết thúc! Hệ thống tự động ghi nhận kết quả.");
                submitQuiz();
                return;
            }
            timeRemaining--;
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').innerText = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }, 1000);
    }

    // Render Questions
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        const optionPrefixes = ['A', 'B', 'C', 'D'];

        questionsData.forEach((qObj) => {
            const qCard = document.createElement('div');
            qCard.id = `question-card-${qObj.id}`;
            qCard.className = `question-card bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200/80 transition-all duration-300 hover:border-slate-300`;

            let optionsHTML = '';
            qObj.options.forEach((optText, optIdx) => {
                const isChecked = userAnswers[qObj.id] === optIdx;
                let optionStyle = 'border-slate-200/90 bg-white hover:bg-slate-50/80 text-slate-700';
                let badgeHTML = '';

                if (isSubmitted) {
                    const isUserPick = userAnswers[qObj.id] === optIdx;
                    const isCorrectAnswer = qObj.answer === optIdx;

                    if (isCorrectAnswer) {
                        optionStyle = 'border-emerald-500/80 bg-emerald-50/70 text-emerald-950 font-semibold shadow-sm';
                        badgeHTML = `<span class="ml-auto text-[11px] bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-medium shadow-sm"><i class="fa-solid fa-check mr-1"></i>Đúng</span>`;
                    } else if (isUserPick && !isCorrectAnswer) {
                        optionStyle = 'border-rose-500/80 bg-rose-50/70 text-rose-950 font-semibold shadow-sm';
                        badgeHTML = `<span class="ml-auto text-[11px] bg-rose-600 text-white px-2.5 py-1 rounded-lg font-medium shadow-sm"><i class="fa-solid fa-xmark mr-1"></i>Sai</span>`;
                    }
                } else if (isChecked) {
                    optionStyle = 'border-brand-500 bg-brand-50/60 text-brand-900 font-semibold shadow-sm ring-1 ring-brand-500/20';
                }

                optionsHTML += `
                    <label class="option-card flex items-center p-3.5 border rounded-xl cursor-pointer ${optionStyle} ${isSubmitted ? 'cursor-default' : ''}">
                        <input type="radio" 
                               name="q_${qObj.id}" 
                               value="${optIdx}" 
                               ${isChecked ? 'checked' : ''} 
                               ${isSubmitted ? 'disabled' : ''} 
                               onchange="selectOption(${qObj.id}, ${optIdx})"
                               class="w-4 h-4 text-brand-600 focus:ring-brand-500 border-slate-300">
                        <span class="ml-3 text-xs font-bold w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600 mr-2 border border-slate-200/60">${optionPrefixes[optIdx]}</span>
                        <span class="text-sm flex-grow">${optText}</span>
                        ${badgeHTML}
                    </label>
                `;
            });

            qCard.innerHTML = `
                <div class="flex items-start justify-between gap-4 mb-4">
                    <h3 class="font-bold text-base text-slate-800 leading-snug flex items-start gap-2.5">
                        <span class="text-xs bg-brand-100 text-brand-700 font-extrabold px-2.5 py-1 rounded-lg border border-brand-200 shrink-0">câu ${qObj.id}</span>
                        <span>${qObj.q}</span>
                    </h3>
                </div>
                <div class="space-y-2.5">
                    ${optionsHTML}
                </div>
            `;

            container.appendChild(qCard);
        });

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    // Render Palette
    function renderPalette() {
        const palette = document.getElementById('question-palette');
        palette.innerHTML = '';

        questionsData.forEach(qObj => {
            const isAnswered = userAnswers.hasOwnProperty(qObj.id);
            let btnClass = 'bg-slate-50 text-slate-600 hover:bg-slate-100 border-slate-200';

            if (isSubmitted) {
                const userPick = userAnswers[qObj.id];
                if (userPick === qObj.answer) {
                    btnClass = 'bg-emerald-500 text-white border-emerald-600 font-bold shadow-sm';
                } else if (userPick !== undefined) {
                    btnClass = 'bg-rose-500 text-white border-rose-600 font-bold shadow-sm';
                } else {
                    btnClass = 'bg-amber-400 text-slate-900 border-amber-500 font-bold shadow-sm';
                }
            } else if (isAnswered) {
                btnClass = 'bg-brand-600 text-white border-brand-700 font-bold shadow-sm shadow-brand-500/20';
            }

            const btn = document.createElement('button');
            btn.id = `palette-btn-${qObj.id}`;
            btn.className = `h-8 w-full rounded-lg border text-xs font-semibold flex items-center justify-center transition ${btnClass}`;
            btn.innerText = qObj.id;
            btn.onclick = () => scrollToQuestion(qObj.id);
            palette.appendChild(btn);
        });
    }

    // Handle Radio Selection
    function selectOption(qId, optionIdx) {
        if (isSubmitted) return;
        userAnswers[qId] = optionIdx;
        updateProgress();
        renderPalette();
        renderQuestions(); // Refresh style dynamically
    }

    // Progress Bar Update
    function updateProgress() {
        const answeredCount = Object.keys(userAnswers).length;
        const percent = Math.round((answeredCount / 100) * 100);
        document.getElementById('progress-text').innerHTML = `
            <i class="fa-solid fa-bars-progress text-brand-500"></i>
            Tiến độ làm bài: <strong class="text-brand-600">${answeredCount}/100</strong> câu`;
        document.getElementById('progress-percent').innerText = `${percent}%`;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    // Smooth Scroll to Question
    function scrollToQuestion(qId) {
        const qCard = document.getElementById(`question-card-${qId}`);
        if (qCard) {
            qCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            qCard.classList.add('ring-2', 'ring-brand-500', 'border-brand-500');
            setTimeout(() => qCard.classList.remove('ring-2', 'ring-brand-500', 'border-brand-500'), 1500);
        }
    }

    // Submit Confirm Prompt
    function confirmSubmit() {
        if (isSubmitted) return;
        const answeredCount = Object.keys(userAnswers).length;
        const unanswered = 100 - answeredCount;

        let msg = `Bạn đã hoàn thành ${answeredCount}/100 câu hỏi.`;
        if (unanswered > 0) {
            msg += ` Vẫn còn ${unanswered} câu chưa được chọn.`;
        }
        msg += ` Bạn chắc chắn muốn nộp bài thi?`;

        if (confirm(msg)) {
            submitQuiz();
        }
    }

    // Submit Logic & Grading
    function submitQuiz() {
        isSubmitted = true;
        clearInterval(timerInterval);

        let correct = 0;
        let wrong = 0;
        let unanswered = 0;

        questionsData.forEach(qObj => {
            const userPick = userAnswers[qObj.id];
            if (userPick === undefined) {
                unanswered++;
            } else if (userPick === qObj.answer) {
                correct++;
            } else {
                wrong++;
            }
        });

        const score = (correct / 10).toFixed(1);

        document.getElementById('score-val').innerText = `${score} / 10`;
        document.getElementById('correct-val').innerText = `${correct} / 100`;
        document.getElementById('wrong-val').innerText = `${wrong} / 100`;
        document.getElementById('unanswered-val').innerText = `${unanswered} / 100`;

        let rating = '';
        if (score >= 9.0) rating = "🏆 Xuất sắc! Kiến thức AI & Deep Learning của bạn ở đẳng cấp Chuyên gia!";
        else if (score >= 8.0) rating = "👏 Ấn tượng! Bạn nắm rất vững nền tảng và ứng dụng của Trí Tuệ Nhân Tạo.";
        else if (score >= 6.5) rating = "👍 Khá tốt! Hãy luyện tập thêm các câu hỏi nâng cao để đạt điểm tối đa.";
        else if (score >= 5.0) rating = "😐 Đạt yêu cầu. Cần ôn luyện thêm các thuật toán cốt lõi và bài tập toán AI.";
        else rating = "⚠️ Cần cố gắng hơn! Hãy dành thời gian xem lại lý thuyết AI từ cơ bản.";

        document.getElementById('rating-text').innerText = rating;
        document.getElementById('result-banner').classList.remove('hidden');

        document.getElementById('submit-btn-top').classList.add('hidden');
        document.getElementById('submit-btn-bottom').classList.add('hidden');

        renderQuestions();
        renderPalette();

        document.getElementById('result-banner').scrollIntoView({ behavior: 'smooth' });
    }

    // Filter Options in Review Mode
    function filterQuestions(type) {
        questionsData.forEach(qObj => {
            const qCard = document.getElementById(`question-card-${qObj.id}`);
            const userPick = userAnswers[qObj.id];
            const isCorrect = userPick === qObj.answer;
            const isUnanswered = userPick === undefined;

            if (type === 'all') {
                qCard.classList.remove('hidden');
            } else if (type === 'correct' && isCorrect) {
                qCard.classList.remove('hidden');
            } else if (type === 'wrong' && !isCorrect && !isUnanswered) {
                qCard.classList.remove('hidden');
            } else if (type === 'unanswered' && isUnanswered) {
                qCard.classList.remove('hidden');
            } else {
                qCard.classList.add('hidden');
            }
        });
    }
</script>
